name: Apply raw-first playback scheduler
on:
  push:
    branches: [ai-rawfirst-hotfix]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply scheduler changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('app.js')
          s=p.read_text()
          def rep(old,new,count=1):
              global s
              n=s.count(old)
              if n!=count: raise SystemExit(f'app.js replacement mismatch: expected {count}, got {n}: {old[:90]!r}')
              s=s.replace(old,new,count)

          rep('/* Streetview Journey v0.1.40 rolling raw buffer scheduler */','/* Streetview Journey v0.1.42 raw-first analysis hysteresis scheduler */')
          rep("const VERSION='0.1.40';","const VERSION='0.1.42';")
          rep("const stabilizedFrameCache=new Map(),stabilizedFrameReadyCache=new Map(),tileLayerCache=new Map(),preparedPairCache=new Map(),preparedPairReadyCache=new Map();","const stabilizedFrameCache=new Map(),stabilizedFrameReadyCache=new Map(),tileLayerCache=new Map(),preparedPairCache=new Map(),preparedPairReadyCache=new Map(),rollCommittedCache=new Map();")
          rep("let rawQueue=[],rawQueued=new Map(),rawWaiters=new Map(),rawActive=0,rawQueueGeneration=0,currentPlaybackIndex=0,heavyScheduled=false;","let rawQueue=[],rawQueued=new Map(),rawWaiters=new Map(),rawActive=0,rawQueueGeneration=0,currentPlaybackIndex=0,heavyScheduled=false;\n  const analysisRuntime=()=>window.__journeyRawRuntime||null;\n  const analysisAllowed=()=>analysisRuntime()?.opticalAllowed!==false;\n  const analysisGeneration=()=>Number(analysisRuntime()?.analysisGeneration||0);\n  function assertAnalysisGeneration(g){if(!analysisAllowed()||g!==analysisGeneration())throw new Error('analysis-stale-generation')}")
          rep("function ensureMotionWorker(){if(motionWorker)return;try{motionWorker=new Worker('/motion-worker.js?v=0.1.25');diag.worker='loading';motionWorker.onmessage=e=>{const m=e.data||{};if(m.type==='ready'){workerReady=true;diag.worker='ready';diag.workerReady=true;return}const p=workerPending.get(m.id);if(!p)return;workerPending.delete(m.id);p.resolve(m.type==='result'?m.result:null)};motionWorker.onerror=()=>{diag.worker='fallback';workerReady=false;diag.workerReady=false;for(const p of workerPending.values())p.resolve(null);workerPending.clear()}}catch{diag.worker='fallback'}}\n  function requestWorker(a,b,i){ensureMotionWorker();if(!motionWorker)return Promise.resolve(null);const aa=new Uint8Array(a.length),bb=new Uint8Array(b.length);for(let k=0;k<aa.length;k++){aa[k]=clamp(Math.round(a[k]),0,255);bb[k]=clamp(Math.round(b[k]),0,255)}const id=++workerSeq;return new Promise(resolve=>{workerPending.set(id,{resolve});try{motionWorker.postMessage({type:'analyze',id,width:ANALYSIS_W,height:ANALYSIS_H,grayA:aa.buffer,grayB:bb.buffer,seed:i*31+aa.length},[aa.buffer,bb.buffer])}catch{workerPending.delete(id);resolve(null)}})}",
              "function ensureMotionWorker(){if(motionWorker)return;try{motionWorker=new Worker('/motion-worker.js?v=0.1.25');diag.worker='loading';motionWorker.onmessage=e=>{const m=e.data||{};if(m.type==='ready'){workerReady=true;diag.worker='ready';diag.workerReady=true;return}const p=workerPending.get(m.id);if(!p)return;workerPending.delete(m.id);p.resolve(p.generation===analysisGeneration()&&analysisAllowed()&&m.type==='result'?m.result:null)};motionWorker.onerror=()=>{diag.worker='fallback';workerReady=false;diag.workerReady=false;for(const p of workerPending.values())p.resolve(null);workerPending.clear()}}catch{diag.worker='fallback'}}\n  function requestWorker(a,b,i){ensureMotionWorker();if(!motionWorker||!analysisAllowed())return Promise.resolve(null);const generation=analysisGeneration(),aa=new Uint8Array(a.length),bb=new Uint8Array(b.length);for(let k=0;k<aa.length;k++){aa[k]=clamp(Math.round(a[k]),0,255);bb[k]=clamp(Math.round(b[k]),0,255)}const id=++workerSeq;return new Promise(resolve=>{workerPending.set(id,{resolve,generation});try{motionWorker.postMessage({type:'analyze',id,width:ANALYSIS_W,height:ANALYSIS_H,grayA:aa.buffer,grayB:bb.buffer,seed:i*31+aa.length},[aa.buffer,bb.buffer])}catch{workerPending.delete(id);resolve(null)}})}")

          rep("function smoothRoll(i){if(rollSmoothCache.has(i))return rollSmoothCache.get(i);const p=(async()=>{const raw=await rawRoll(i);if(i===0)return clamp(raw*.55,-ROLL_LIMIT,ROLL_LIMIT);const prev=await smoothRoll(i-1),target=prev*(1-ROLL_EMA)+raw*ROLL_EMA;return clamp(prev+clamp(target-prev,-ROLL_STEP_LIMIT,ROLL_STEP_LIMIT),-ROLL_LIMIT,ROLL_LIMIT)})();rollSmoothCache.set(i,p);return p}",
              "function smoothRoll(i){if(rollSmoothCache.has(i))return rollSmoothCache.get(i);const generation=analysisGeneration(),p=(async()=>{if(!analysisAllowed())return 0;const raw=await rawRoll(i);assertAnalysisGeneration(generation);let prev=0;if(i>0&&Number.isFinite(rollCommittedCache.get(i-1)))prev=rollCommittedCache.get(i-1);else{for(let k=i-1;k>=Math.max(0,i-8);k--){const v=rollCommittedCache.get(k);if(Number.isFinite(v)){prev=v;break}}}const target=i===0?raw*.55:prev*(1-ROLL_EMA)+raw*ROLL_EMA,result=clamp(prev+clamp(target-prev,-ROLL_STEP_LIMIT,ROLL_STEP_LIMIT),-ROLL_LIMIT,ROLL_LIMIT);assertAnalysisGeneration(generation);rollCommittedCache.set(i,result);return result})();rollSmoothCache.set(i,p);p.catch(()=>rollSmoothCache.delete(i));return p}")

          for old,new in [
            ("async function rawRoll(i){if(rollRawCache.has(i))return rollRawCache.get(i);","async function rawRoll(i){if(!analysisAllowed())return 0;if(rollRawCache.has(i))return rollRawCache.get(i);"),
            ("async function correctedGray(i){if(correctedGrayCache.has(i))return correctedGrayCache.get(i);","async function correctedGray(i){if(!analysisAllowed())return null;if(correctedGrayCache.has(i))return correctedGrayCache.get(i);"),
            ("async function farPair(i){if(farPairCache.has(i))return farPairCache.get(i);","async function farPair(i){if(!analysisAllowed())return{dx:0,dy:0,confidence:0};if(farPairCache.has(i))return farPairCache.get(i);"),
            ("async function workerFeaturePair(i){if(workerPairCache.has(i))return workerPairCache.get(i);","async function workerFeaturePair(i){if(!analysisAllowed())return{dx:0,dy:0,roll:0,logScale:0,confidence:0,tracks:0,source:'analysis-paused'};if(workerPairCache.has(i))return workerPairCache.get(i);"),
            ("async function motionPair(i){if(motionPairCache.has(i))return motionPairCache.get(i);","async function motionPair(i){if(!analysisAllowed())return{dx:0,dy:0,roll:0,logScale:0,confidence:0,tracks:0,source:'analysis-paused'};if(motionPairCache.has(i))return motionPairCache.get(i);"),
            ("function rawTrajectory(i){if(rawTrajectoryCache.has(i))return rawTrajectoryCache.get(i);","function rawTrajectory(i){if(!analysisAllowed())return Promise.resolve({x:0,y:0,roll:0,logScale:0,confidence:0});if(rawTrajectoryCache.has(i))return rawTrajectoryCache.get(i);"),
            ("function cameraPose(i){if(cameraPoseCache.has(i))return cameraPoseCache.get(i);","function cameraPose(i){if(!analysisAllowed())return Promise.resolve({x:0,y:0,roll:0,scale:1,confidence:0,source:'analysis-paused'});if(cameraPoseCache.has(i))return cameraPoseCache.get(i);"),
            ("async function stabilizedGray(i){if(stabilizedGrayCache.has(i))return stabilizedGrayCache.get(i);","async function stabilizedGray(i){if(!analysisAllowed())return null;if(stabilizedGrayCache.has(i))return stabilizedGrayCache.get(i);"),
            ("async function tileVectors(i){if(tileCache.has(i))return tileCache.get(i);","async function tileVectors(i){if(!analysisAllowed())return[];if(tileCache.has(i))return tileCache.get(i);")]: rep(old,new)

          rep("function createStabilizedFrame(i){if(stabilizedFrameCache.has(i)){diag.frameCacheHits++;return stabilizedFrameCache.get(i)}const p=(async()=>{const im=await loadRender(route[i]?.url),{w,h}=canvasSize(),[roll,pose]=await Promise.all([smoothRoll(i),cameraPose(i)]),c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d',{alpha:false});g.fillStyle='#05070a';g.fillRect(0,0,w,h);drawBase(g,im,i,roll,pose,1,'render');const out={canvas:c,roll:roll+pose.roll,pose,image:im,index:i};stabilizedFrameReadyCache.set(i,out);return out})();stabilizedFrameCache.set(i,p);p.catch(()=>{stabilizedFrameCache.delete(i);stabilizedFrameReadyCache.delete(i)});return p}",
              "function createStabilizedFrame(i){if(!analysisAllowed())return Promise.reject(new Error('analysis-paused'));if(stabilizedFrameCache.has(i)){diag.frameCacheHits++;return stabilizedFrameCache.get(i)}const generation=analysisGeneration(),p=(async()=>{const im=await loadRender(route[i]?.url),{w,h}=canvasSize(),[roll,pose]=await Promise.all([smoothRoll(i),cameraPose(i)]);assertAnalysisGeneration(generation);const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d',{alpha:false});g.fillStyle='#05070a';g.fillRect(0,0,w,h);drawBase(g,im,i,roll,pose,1,'render');assertAnalysisGeneration(generation);const out={canvas:c,roll:roll+pose.roll,pose,image:im,index:i};stabilizedFrameReadyCache.set(i,out);return out})();stabilizedFrameCache.set(i,p);p.catch(()=>{stabilizedFrameCache.delete(i);stabilizedFrameReadyCache.delete(i)});return p}")
          rep("function preparePair(i){if(preparedPairCache.has(i)){diag.pairCacheHits++;return preparedPairCache.get(i)}const p=(async()=>{if(!route[i]||!route[i+1])throw new Error('Pair画像が不足しています');const[a,b,vs]=await Promise.all([createStabilizedFrame(i),createStabilizedFrame(i+1),tileVectors(i)]);const out={i,a,b,vs,bs:perceptualBridgeStrength(i)};preparedPairReadyCache.set(i,out);return out})();preparedPairCache.set(i,p);p.catch(()=>{preparedPairCache.delete(i);preparedPairReadyCache.delete(i)});return p}",
              "function preparePair(i){if(!analysisAllowed())return Promise.reject(new Error('analysis-paused'));if(preparedPairCache.has(i)){diag.pairCacheHits++;return preparedPairCache.get(i)}const generation=analysisGeneration(),p=(async()=>{if(!route[i]||!route[i+1])throw new Error('Pair画像が不足しています');const[a,b,vs]=await Promise.all([createStabilizedFrame(i),createStabilizedFrame(i+1),tileVectors(i)]);assertAnalysisGeneration(generation);const out={i,a,b,vs,bs:perceptualBridgeStrength(i)};preparedPairReadyCache.set(i,out);return out})();preparedPairCache.set(i,p);p.catch(()=>{preparedPairCache.delete(i);preparedPairReadyCache.delete(i)});return p}")
          rep("function scheduleHeavy(i){if(heavyScheduled||!criticalRawReady(i))return;heavyScheduled=true;const generation=rawQueueGeneration;idle(()=>{heavyScheduled=false;if(generation!==rawQueueGeneration)return;const base=currentPlaybackIndex;if(!criticalRawReady(base))return;for(let k=base;k<Math.min(route.length,base+HEAVY_PRELOAD_AHEAD+1);k++)smoothRoll(k).catch(()=>{});for(let k=base;k<Math.min(route.length-1,base+HEAVY_PRELOAD_AHEAD);k++)workerFeaturePair(k).catch(()=>{});for(let k=base;k<Math.min(route.length-1,base+PAIR_PRELOAD_AHEAD);k++)preparePair(k).catch(()=>{})})}",
              "function scheduleHeavy(i){if(heavyScheduled||!criticalRawReady(i)||!analysisAllowed())return;heavyScheduled=true;const rawGeneration=rawQueueGeneration,generation=analysisGeneration();idle(()=>{heavyScheduled=false;if(rawGeneration!==rawQueueGeneration||generation!==analysisGeneration()||!analysisAllowed())return;const base=currentPlaybackIndex;if(!criticalRawReady(base))return;for(let k=base;k<Math.min(route.length,base+HEAVY_PRELOAD_AHEAD+1);k++)smoothRoll(k).catch(()=>{});for(let k=base;k<Math.min(route.length-1,base+HEAVY_PRELOAD_AHEAD);k++)workerFeaturePair(k).catch(()=>{});for(let k=base;k<Math.min(route.length-1,base+PAIR_PRELOAD_AHEAD);k++)preparePair(k).catch(()=>{})})}")
          rep("preparedPairCache.delete(k);preparedPairReadyCache.delete(k)}diag.rawReady=renderReadyCache.size}","preparedPairCache.delete(k);preparedPairReadyCache.delete(k);rollCommittedCache.delete(k)}diag.rawReady=renderReadyCache.size}")
          rep("[renderCache,renderReadyCache,corsCache,grayCache,rollRawCache,rollSmoothCache,correctedGrayCache,farPairCache,workerPairCache,motionPairCache,rawTrajectoryCache,cameraPoseCache,stabilizedGrayCache,tileCache,anchorCache,blendAssetCache,stabilizedFrameCache,stabilizedFrameReadyCache,tileLayerCache,preparedPairCache,preparedPairReadyCache].forEach(c=>c.clear());","[renderCache,renderReadyCache,corsCache,grayCache,rollRawCache,rollSmoothCache,correctedGrayCache,farPairCache,workerPairCache,motionPairCache,rawTrajectoryCache,cameraPoseCache,stabilizedGrayCache,tileCache,anchorCache,blendAssetCache,stabilizedFrameCache,stabilizedFrameReadyCache,tileLayerCache,preparedPairCache,preparedPairReadyCache,rollCommittedCache].forEach(c=>c.clear());")

          old="async function play(frames){const pt=++token;route=Array.isArray(frames)?frames.slice(0,URL_WINDOW_AHEAD+1):[];clearJourneyCaches();syncStreamFrames();diag.targetMs=speedMs;if(!route.length)throw new Error('再生できる画像がありません');ui.place.textContent=route[0].sequenceId?`Sequence #${route[0].sequenceId}`:'Journey';await primeRawBuffer(0);await showFirst();let i=0,lastPresented=performance.now(),clockOrigin=lastPresented;currentPlaybackIndex=0;warmAhead(0);while(pt===token){syncStreamFrames();if(i>=route.length-1){const hasNext=await waitForStreamFrame(i,pt);if(!hasNext)break;clockOrigin=performance.now()-i*speedMs;warmAhead(i)}const target=i+1;warmAhead(i);let dueAt=clockOrigin+target*speedMs;const readyAtDeadline=renderReadyCache.has(route[target]?.url);if(readyAtDeadline){if(!await waitUntilDue(dueAt,pt))return}else{const now=performance.now();if(now<dueAt&&!(await waitUntilDue(dueAt,pt)))return;if(pt!==token)return;if(!renderReadyCache.has(route[target]?.url)){const beforeWait=performance.now();await waitForRawFrame(target,pt);if(pt!==token)return;const delay=Math.max(0,performance.now()-Math.max(dueAt,beforeWait));if(delay>0){clockOrigin+=delay;dueAt=clockOrigin+target*speedMs}}}if(pt!==token)return;if(!presentFrame(target,dueAt)){await waitForRawFrame(target,pt);if(pt!==token)return;const late=Math.max(0,performance.now()-dueAt);if(late>0){clockOrigin+=late;dueAt=clockOrigin+target*speedMs}if(!presentFrame(target,dueAt))throw new Error('画像を表示できませんでした')}const now=performance.now();diag.lastDeltaMs=now-lastPresented;lastPresented=now;i=target;currentPlaybackIndex=i;trimJourneyCaches(i);warmAhead(i)}if(pt===token){window.__journeyPlaybackState={...(window.__journeyPlaybackState||{}),index:i,available:route.length,total:Math.max(route.length,streamState()?.total||0),streaming:false,complete:true};try{window.dispatchEvent(new CustomEvent('journey-playback-ended',{detail:{index:i}}))}catch{}ui.net.textContent='Journey完了'}}"
          new="async function play(frames){const pt=++token;route=Array.isArray(frames)?frames.slice(0,URL_WINDOW_AHEAD+1):[];clearJourneyCaches();syncStreamFrames();diag.targetMs=speedMs;if(!route.length)throw new Error('再生できる画像がありません');ui.place.textContent=route[0].sequenceId?`Sequence #${route[0].sequenceId}`:'Journey';await primeRawBuffer(0);await showFirst();let i=0,lastPresented=performance.now();currentPlaybackIndex=0;warmAhead(0);while(pt===token){syncStreamFrames();if(i>=route.length-1){const hasNext=await waitForStreamFrame(i,pt);if(!hasNext)break;warmAhead(i)}const target=i+1;warmAhead(i);let dueAt=lastPresented+speedMs;if(!await waitUntilDue(dueAt,pt))return;if(pt!==token)return;if(!renderReadyCache.has(route[target]?.url)){await waitForRawFrame(target,pt);if(pt!==token)return;dueAt=Math.max(dueAt,performance.now())}if(pt!==token)return;if(!presentFrame(target,dueAt)){await waitForRawFrame(target,pt);if(pt!==token)return;dueAt=Math.max(dueAt,performance.now());if(!presentFrame(target,dueAt))throw new Error('画像を表示できませんでした')}const now=performance.now();diag.lastDeltaMs=now-lastPresented;lastPresented=now;i=target;currentPlaybackIndex=i;trimJourneyCaches(i);warmAhead(i)}if(pt===token){window.__journeyPlaybackState={...(window.__journeyPlaybackState||{}),index:i,available:route.length,total:Math.max(route.length,streamState()?.total||0),streaming:false,complete:true};try{window.dispatchEvent(new CustomEvent('journey-playback-ended',{detail:{index:i}}))}catch{}ui.net.textContent='Journey完了'}}"
          rep(old,new)
          p.write_text(s)
          PY

          cat > raw-runtime.js <<'EOF'
          /* Streetview Journey raw/analysis transport split v0.1.42 */
          (()=>{
            'use strict';
            if(window.__journeyRawRuntimeInstalled)return;
            window.__journeyRawRuntimeInstalled=true;
            const VERSION='0.1.42',RAW_TIMEOUT_MS=2600,OPTICAL_PAUSE_BELOW=8,OPTICAL_RESUME_AT=14,ANALYSIS_RELAXED_AT=16;
            const nativeSetTimeout=window.setTimeout.bind(window),nativeClearTimeout=window.clearTimeout.bind(window),nativeRIC=window.requestIdleCallback?.bind(window),nativeCancelRIC=window.cancelIdleCallback?.bind(window);
            const srcDesc=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,'src'),nativeSetSrc=srcDesc?.set;
            const timers=new WeakMap(),started=new WeakMap(),analysisQueued=new Set(),analysisActiveImages=new Set();
            let opticalAllowed=true,analysisGeneration=0,analysisActive=0,analysisQueue=[];
            const now=()=>performance.now();
            function sameOrigin(u){try{return new URL(u,location.href).origin===location.origin}catch{return false}}
            function unwrapProxy(value){try{const u=new URL(String(value||''),location.href);if(u.origin===location.origin&&u.pathname==='/api/imagery'&&u.searchParams.get('mode')==='mapillary-image'){const source=u.searchParams.get('url');if(source)return source}}catch{}return String(value||'')}
            function proxyFor(value){const raw=unwrapProxy(value);if(!raw||sameOrigin(raw))return raw;return `/api/imagery?mode=mapillary-image&url=${encodeURIComponent(raw)}`}
            function frameIndexFor(raw){for(const list of [window.__journeyStreamState?.frames,window.__journeySelectedRoute?.frames]){if(!Array.isArray(list))continue;for(let i=0;i<list.length;i++){const f=list[i];if(f&&(unwrapProxy(f.url)===raw||f.sourceUrl===raw))return i}}return null}
            function emit(phase,detail){try{window.dispatchEvent(new CustomEvent('journey-image-load',{detail:{phase,...detail}}))}catch{}}
            function rawAhead(){return Number(window.__journeyPlaybackState?.rawAheadReady??window.__journeyDiagnostics?.rawAheadReady??0)}
            function clearTimer(im){const t=timers.get(im);if(t){nativeClearTimeout(t);timers.delete(im)}}
            function finishAnalysis(im){if(analysisActiveImages.delete(im))analysisActive=Math.max(0,analysisActive-1);analysisQueued.delete(im);pumpAnalysis()}
            function installLifecycle(im){if(im.__journeyLifecycleInstalled)return;im.__journeyLifecycleInstalled=true;im.addEventListener('load',()=>{const meta=started.get(im);if(!meta)return;clearTimer(im);started.delete(im);if(meta.purpose==='analysis')finishAnalysis(im);if(meta.generation!=null&&meta.generation!==analysisGeneration)return;emit('complete',{...meta,elapsedMs:Math.round(now()-meta.startedAt),width:im.naturalWidth||0,height:im.naturalHeight||0})});im.addEventListener('error',()=>{const meta=started.get(im);if(!meta)return;clearTimer(im);started.delete(im);if(meta.purpose==='analysis')finishAnalysis(im);if(meta.generation!=null&&meta.generation!==analysisGeneration)return;emit('error',{...meta,elapsedMs:Math.round(now()-meta.startedAt)})})}
            function analysisCapacity(){if(!opticalAllowed)return 0;return rawAhead()>=ANALYSIS_RELAXED_AT&&Number(window.__journeyDiagnostics?.rawActive||0)===0?2:1}
            function cancelAnalysis(reason='raw-low'){analysisGeneration++;const queued=analysisQueue;analysisQueue=[];for(const q of queued){analysisQueued.delete(q.im);started.delete(q.im);try{nativeSetSrc.call(q.im,'')}catch{};nativeSetTimeout(()=>{try{q.im.dispatchEvent(new Event('error'))}catch{}},0)}for(const im of [...analysisActiveImages]){analysisActiveImages.delete(im);analysisActive=Math.max(0,analysisActive-1);started.delete(im);try{nativeSetSrc.call(im,'')}catch{};nativeSetTimeout(()=>{try{im.dispatchEvent(new Event('error'))}catch{}},0)}emit('analysis-generation',{generation:analysisGeneration,reason})}
            function updateOpticalGate(){const ahead=rawAhead();if(opticalAllowed&&ahead<OPTICAL_PAUSE_BELOW){opticalAllowed=false;cancelAnalysis('raw-below-8');emit('optical-paused',{rawAhead:ahead,threshold:OPTICAL_PAUSE_BELOW,generation:analysisGeneration})}else if(!opticalAllowed&&ahead>=OPTICAL_RESUME_AT){opticalAllowed=true;analysisGeneration++;emit('optical-resumed',{rawAhead:ahead,threshold:OPTICAL_RESUME_AT,generation:analysisGeneration});pumpAnalysis()}return opticalAllowed}
            function pumpAnalysis(){updateOpticalGate();const cap=analysisCapacity();while(analysisActive<cap&&analysisQueue.length){const q=analysisQueue.shift();analysisQueued.delete(q.im);if(q.generation!==analysisGeneration||!opticalAllowed){started.delete(q.im);continue}analysisActive++;analysisActiveImages.add(q.im);started.set(q.im,q.meta);emit('start',q.meta);nativeSetSrc.call(q.im,q.actual)}}
            if(nativeSetSrc){Object.defineProperty(HTMLImageElement.prototype,'src',{configurable:srcDesc.configurable,enumerable:srcDesc.enumerable,get:srcDesc.get,set(value){installLifecycle(this);clearTimer(this);const requested=String(value||''),raw=unwrapProxy(requested),analysis=this.crossOrigin==='anonymous',actual=analysis?proxyFor(raw):raw,purpose=analysis?'analysis':'raw',index=frameIndexFor(raw);if(analysis){updateOpticalGate();const generation=analysisGeneration,meta={purpose,index,transport:'same-origin-proxy',startedAt:now(),timeoutMs:1800,generation};if(!opticalAllowed){emit('analysis-blocked',{...meta,rawAhead:rawAhead()});nativeSetTimeout(()=>{try{this.dispatchEvent(new Event('error'))}catch{}},0);return}analysisQueue.push({im:this,actual,meta,generation});analysisQueued.add(this);pumpAnalysis();return}const meta={purpose,index,transport:'mapillary-direct',startedAt:now(),timeoutMs:RAW_TIMEOUT_MS};started.set(this,meta);emit('start',meta);const timer=nativeSetTimeout(()=>{if(started.get(this)!==meta)return;timers.delete(this);started.delete(this);emit('timeout',{...meta,elapsedMs:Math.round(now()-meta.startedAt)});try{nativeSetSrc.call(this,'')}catch{};try{this.dispatchEvent(new Event('error'))}catch{}},RAW_TIMEOUT_MS);timers.set(this,timer);nativeSetSrc.call(this,actual)}})}
            window.requestIdleCallback=(callback,options={})=>{let cancelled=false,inner=null;const attempt=deadline=>{if(cancelled)return;if(updateOpticalGate()){callback(deadline);return}schedule()};const schedule=()=>{if(cancelled)return;if(nativeRIC)inner=nativeRIC(attempt,{timeout:Math.max(120,Number(options.timeout)||0)});else inner=nativeSetTimeout(()=>attempt({didTimeout:true,timeRemaining:()=>0}),120)};schedule();return{__journeyIdle:true,cancel(){cancelled=true;if(nativeRIC&&nativeCancelRIC&&inner!=null){try{nativeCancelRIC(inner)}catch{}}else if(inner!=null)nativeClearTimeout(inner)}}};
            window.cancelIdleCallback=handle=>{if(handle?.__journeyIdle)return handle.cancel();if(nativeCancelRIC)return nativeCancelRIC(handle);nativeClearTimeout(handle)};
            const gatePoll=nativeSetTimeout;setInterval(()=>{const before=opticalAllowed;updateOpticalGate();if(opticalAllowed&&before)pumpAnalysis()},80);
            window.__journeyRawRuntime={version:VERSION,rawTimeoutMs:RAW_TIMEOUT_MS,opticalPauseBelow:OPTICAL_PAUSE_BELOW,opticalResumeAt:OPTICAL_RESUME_AT,analysisRelaxedAt:ANALYSIS_RELAXED_AT,get opticalAllowed(){return opticalAllowed},get analysisGeneration(){return analysisGeneration},get analysisActive(){return analysisActive},get analysisQueued(){return analysisQueue.length}};
          })();
          EOF

          python3 - <<'PY'
          from pathlib import Path
          for name in ['journey-map.html','sw.js']:
              p=Path(name); s=p.read_text()
              s=s.replace('raw-runtime.js?v=0.1.41','raw-runtime.js?v=0.1.42')
              s=s.replace('app.js?v=0.1.40','app.js?v=0.1.42')
              if name=='sw.js': s=s.replace('streetview-shell-phase4-rawsplit-v6','streetview-shell-phase4-rawfirst-v7')
              p.write_text(s)
          PY

          node --check app.js
          node --check raw-runtime.js
          git diff --check
          grep -q "OPTICAL_RESUME_AT=14" raw-runtime.js
          grep -q "analysisGeneration" app.js
          grep -q "lastPresented+speedMs" app.js
          ! grep -q "await smoothRoll(i-1)" app.js
      - name: Commit once to main
