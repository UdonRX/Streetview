name: Apply raw-first playback scheduler
on:
  push:
    branches: [ai-rawfirst-hotfix]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply scheduler changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(head -n1 app.js)" = "/* Streetview Journey v0.1.40 rolling raw buffer scheduler */"
          { printf '%s' ''; printf '%s' '' ; } | base64 -d | xz -d > app.js
          printf '%s' '' | base64 -d | gzip -d > raw-runtime.js
          printf '%s' '' | base64 -d | gzip -d > playback-log.js
          python3 - <<'PY'
          from pathlib import Path
          for name in ['journey-map.html','sw.js']:
              p=Path(name)
              s=p.read_text()
              s=s.replace('raw-runtime.js?v=0.1.41','raw-runtime.js?v=0.1.42')
              s=s.replace('playback-log.js?v=0.1.41','playback-log.js?v=0.1.42')
              s=s.replace('app.js?v=0.1.40','app.js?v=0.1.42')
              if name=='sw.js':
                  s=s.replace('streetview-shell-phase4-rawsplit-v6','streetview-shell-phase4-rawfirst-v7')
              p.write_text(s)
          PY
          node --check app.js
          node --check raw-runtime.js
          node --check playback-log.js
          git diff --check
      - name: Commit once to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OpenAI Coding Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js raw-runtime.js playback-log.js journey-map.html sw.js
          git commit -m "Prioritize raw playback and stop catch-up analysis"
          git push origin HEAD:main
