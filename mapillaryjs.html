<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#050b0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MapillaryJS Journey Test</title>
  <link rel="stylesheet" href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css" />
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans",sans-serif;background:#050b0a;color:#fff}
    *{box-sizing:border-box}html,body,#mly{width:100%;height:100%;margin:0;overflow:hidden}body{background:#050b0a}button,input{font:inherit}
    #mly{position:fixed;inset:0;background:#020504;touch-action:none}
    .top{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
    .glass{border:1px solid rgba(255,255,255,.14);background:rgba(5,12,11,.78);box-shadow:0 12px 34px rgba(0,0,0,.3);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .title{padding:9px 11px;border-radius:14px;display:grid;gap:2px}.title b{font-size:12px}.title small{font-size:8px;color:rgba(255,255,255,.55)}
    .back{pointer-events:auto;min-height:38px;padding:0 12px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(5,12,11,.78);color:#fff;font-weight:800;font-size:10px;text-decoration:none;display:grid;place-items:center;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .controls{position:fixed;z-index:22;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding:10px;border-radius:17px;display:grid;gap:8px;pointer-events:auto}
    .control-row{display:grid;grid-template-columns:1fr 1fr auto;gap:7px}.controls button{min-height:42px;border:1px solid rgba(255,255,255,.13);border-radius:12px;background:rgba(255,255,255,.07);color:#fff;font-size:10px;font-weight:800}.controls .primary{background:#fff;color:#07110f}.controls button:disabled{opacity:.4}.speed{display:flex;align-items:center;gap:8px;font-size:9px;color:rgba(255,255,255,.6)}.speed input{width:100%;accent-color:#fff}.speed output{width:52px;text-align:right;color:#fff;font-variant-numeric:tabular-nums}
    .status{font-size:9px;line-height:1.45;color:rgba(255,255,255,.68);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .diag{position:fixed;z-index:21;top:calc(env(safe-area-inset-top,0px) + 73px);right:10px;width:min(340px,calc(100vw - 20px));max-height:calc(100vh - 265px - env(safe-area-inset-bottom,0px));overflow:auto;padding:10px;border-radius:15px;display:none;pointer-events:auto}.diag.is-open{display:block}.diag-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.diag-head b{font-size:10px}.diag-head button{border:1px solid rgba(255,255,255,.12);border-radius:9px;background:rgba(255,255,255,.06);color:#fff;padding:6px 9px;font-size:8px}.grid{display:grid;grid-template-columns:1fr auto;gap:5px 9px;font-size:8px;line-height:1.35}.grid span{color:rgba(255,255,255,.5)}.grid b{font-variant-numeric:tabular-nums;text-align:right;max-width:200px;overflow-wrap:anywhere}.note{margin:8px 0 0;font-size:7px;line-height:1.45;color:rgba(255,255,255,.42)}
    .sheet{position:fixed;z-index:40;inset:0;display:grid;place-items:end center;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:rgba(0,0,0,.42)}.sheet[hidden]{display:none}.sheet-card{width:min(520px,100%);padding:16px;border-radius:22px;background:#0b1513;border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 50px rgba(0,0,0,.45)}.sheet-card h1{font-size:18px;margin:0 0 6px}.sheet-card p{font-size:10px;line-height:1.55;color:rgba(255,255,255,.58);margin:0 0 12px}.sheet-card input{width:100%;min-height:44px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.06);color:#fff;padding:0 12px}.sheet-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}.sheet-actions button{min-height:42px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.07);color:#fff;font-weight:800}.sheet-actions .save{background:#fff;color:#07110f}
    @media(orientation:landscape){.controls{left:10px;right:auto;width:min(430px,44vw)}.diag{top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;max-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 20px)}}
  </style>
</head>
<body>
  <div id="mly" aria-label="MapillaryJS公式Viewer"></div>
  <header class="top">
    <div class="title glass"><b>MapillaryJS</b><small>烏丸御池 → 四条烏丸 / 公式Viewer</small></div>
    <a class="back" href="/">テスト一覧</a>
  </header>
  <section id="diag" class="diag glass" aria-label="Diagnostics">
    <div class="diag-head"><b>Diagnostics</b><button id="copyDiag" type="button">コピー</button></div>
    <div id="diagGrid" class="grid"></div>
    <p class="note">画像表示はMapillaryJS標準 image tiling / WebGL。自動再生は公式Instantaneous transition＋sequence cache depth 4を使用。Graph APIはGPS判定用。</p>
  </section>
  <section class="controls glass" aria-label="再生操作">
    <div class="control-row"><button id="start" class="primary" type="button" disabled>再生開始</button><button id="stop" type="button" disabled>停止</button><button id="toggleDiag" type="button">診断</button></div>
    <label class="speed"><span>速度</span><input id="speed" type="range" min="450" max="1800" step="50" value="900" /><output id="speedOut">0.90s</output></label>
    <div id="status" class="status">MapillaryJSを準備中…</div>
  </section>
  <section id="tokenSheet" class="sheet" hidden>
    <div class="sheet-card"><h1>Mapillary Access Token</h1><p>既存テストと同じlocalStorageキーを使う。トークンはGitHubへ保存しない。</p><input id="tokenInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="MLY|..." /><div class="sheet-actions"><button id="saveToken" class="save" type="button">保存して開始</button><button id="cancelToken" type="button">戻る</button></div></div>
  </section>
  <script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script>
  <script>
  (()=>{
    'use strict';
    const VERSION='mapillaryjs-speed-cache-v3';
    const TOKEN_KEY='streetview:mapillary-token';
    const ROUTE_CACHE_KEY='streetview:mapillaryjs-route-cache';
    const ROUTE_SIGNATURE='karasuma-oike-shijo-50';
    const GRAPH='https://graph.mapillary.com';
    const SEED_SEQUENCE_ID='zq8vy4bui6shkiv29w5fp9';
    const HOT_SEQUENCE_ID='eRtWQS4YlTPjy1rxpokA2q';
    const HOT_START_IMAGE_ID='1660100068763369';
    const HOT_GOAL_IMAGE_ID='2131906120977191';
    const START={lat:35.01039,lng:135.75943,name:'烏丸御池'};
    const GOAL={lat:35.00367,lng:135.75937,name:'四条烏丸'};
    const TARGET_FRAMES=50;
    const MAX_ROUTE_DISTANCE=50;
    const ENDPOINT_LIMIT=180;
    const PROBE_COUNT=28;
    const REFINE_RADIUS=14;
    const REGRESSION_SOFT=0.018;
    const REGRESSION_HARD=0.08;
    const REGRESSION_STREAK_LIMIT=3;
    const CACHE_DEPTH={sequence:4,spherical:0,step:0,turn:0};
    const $=id=>document.getElementById(id);
    const state={viewer:null,sequenceId:'—',direction:'—',frames:[],cursor:0,playing:false,moveToken:0,successfulFrames:0,transitionTimes:[],cadenceTimes:[],initialDisplayMs:null,lastTransitionMs:null,lastCadenceMs:null,currentProgress:null,currentRouteDistance:null,currentTravelHeading:null,currentViewHeading:null,userViewOffset:0,currentProjection:'—',stopReason:'not-started',reverseEvents:0,viewJumps:0,logs:[],pointerActive:false,heldOffset:0,correcting:false,setupStarted:performance.now(),setupMs:null,maxProgressSeen:null,regressionStreak:0,startDistance:null,goalDistance:null,preparedFrom:'—',denseFrameCount:0,lastDisplayAt:null,deadlineMisses:0,fastMoves:0,slowMoves:0,routeCacheHit:false};
    const token=()=>{try{return localStorage.getItem(TOKEN_KEY)||''}catch{return''}};
    const setStatus=t=>{$('status').textContent=t};
    const norm360=v=>(Number(v)%360+360)%360;
    const angleDiff=(a,b)=>{let d=norm360(a)-norm360(b);if(d>180)d-=360;if(d<-180)d+=360;return d};
    const sleep=ms=>new Promise(r=>setTimeout(r,ms));
    function distanceMeters(a,b){const r=Math.PI/180,p1=a.lat*r,p2=b.lat*r,dp=(b.lat-a.lat)*r,dl=(b.lng-a.lng)*r,s=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 12742000*Math.atan2(Math.sqrt(s),Math.sqrt(Math.max(0,1-s)))}
    function bearing(a,b){const r=Math.PI/180,p1=a.lat*r,p2=b.lat*r,dl=(b.lng-a.lng)*r,y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return norm360(Math.atan2(y,x)*180/Math.PI)}
    function interpolate(t){return{lat:START.lat+(GOAL.lat-START.lat)*t,lng:START.lng+(GOAL.lng-START.lng)*t}}
    function routeMetrics(p){const lat0=(START.lat+GOAL.lat)*.5*Math.PI/180,cos=Math.cos(lat0),mx=111320*cos,my=111320,vx=(GOAL.lng-START.lng)*mx,vy=(GOAL.lat-START.lat)*my,px=(p.lng-START.lng)*mx,py=(p.lat-START.lat)*my,den=vx*vx+vy*vy,t=den?(px*vx+py*vy)/den:0,tc=Math.max(0,Math.min(1,t)),cx=vx*tc,cy=vy*tc;return{progress:t,distance:Math.hypot(px-cx,py-cy)}}
    function pointBbox(p,radiusM){const latPad=radiusM/111320,lngPad=radiusM/(111320*Math.max(.2,Math.cos(p.lat*Math.PI/180)));return`${p.lng-lngPad},${p.lat-latPad},${p.lng+lngPad},${p.lat+latPad}`}
    function sequenceOf(v){return String(v?.id??v??'').trim()}
    function pointOf(meta){const c=meta?.computed_geometry?.coordinates;return Array.isArray(c)&&c.length>=2?{lat:Number(c[1]),lng:Number(c[0])}:null}
    function compactRoute(route){return{signature:ROUTE_SIGNATURE,savedAt:Date.now(),sequenceId:route.sequenceId,direction:route.direction,frames:route.frames,startDistance:route.startDistance,goalDistance:route.goalDistance,pano:route.pano,denseFrameCount:route.denseFrameCount,progressGain:route.progressGain,source:route.source}}
    function saveRouteCache(route){try{localStorage.setItem(ROUTE_CACHE_KEY,JSON.stringify(compactRoute(route)))}catch{}}
    function loadRouteCache(){try{const c=JSON.parse(localStorage.getItem(ROUTE_CACHE_KEY)||'null');if(!c||c.signature!==ROUTE_SIGNATURE||!c.sequenceId||!Array.isArray(c.frames)||c.frames.length<20)return null;const valid=c.frames.every(f=>f&&f.id&&Number.isFinite(+f.routeProgress)&&Number.isFinite(+f.routeDistance));if(!valid)return null;return{...c,source:'local-route-cache'}}catch{return null}}
    async function mly(path){const t=token();if(!t)throw new Error('Mapillary Access Tokenが未設定です');const sep=path.includes('?')?'&':'?';const res=await fetch(`${GRAPH}${path}${sep}access_token=${encodeURIComponent(t)}`,{cache:'no-store'});const data=await res.json().catch(()=>({}));if(!res.ok||data?.error){const error=new Error(data?.error?.message||`Mapillary API ${res.status}`);error.reduceAmount=/reduce the amount of data/i.test(error.message);throw error}return data}
    async function orderedIds(sequenceId){const data=await mly(`/image_ids?sequence_id=${encodeURIComponent(sequenceId)}`);return(data?.data||[]).map(x=>String(x?.id??x)).filter(Boolean)}
    async function metaPart(ids,fields='id,sequence,computed_geometry,compass_angle,computed_compass_angle,is_pano'){if(!ids.length)return{data:[]};try{return await mly(`/images?image_ids=${encodeURIComponent(ids.join(','))}&limit=${ids.length}&fields=${encodeURIComponent(fields)}`)}catch(error){if(ids.length<=4)throw error;const half=Math.ceil(ids.length/2),a=await metaPart(ids.slice(0,half),fields),b=await metaPart(ids.slice(half),fields);return{data:[...(a?.data||[]),...(b?.data||[])]}}}
    async function metadata(ids,fields){const out=new Map(),unique=[...new Set(ids.filter(Boolean))];for(let i=0;i<unique.length;i+=48){const data=await metaPart(unique.slice(i,i+48),fields);for(const m of data?.data||[])out.set(String(m.id),m)}return out}
    function sampleIds(ids,target=TARGET_FRAMES){if(ids.length<=target)return ids.slice();const out=[],used=new Set(),step=(ids.length-1)/(target-1);for(let i=0;i<target;i++){const id=ids[Math.round(i*step)];if(id&&!used.has(id)){used.add(id);out.push(id)}}return out}
    async function framesFromIds(sequenceId,ids,source,denseFrameCount,startDistance=null,goalDistance=null){const metas=await metadata(ids),frames=[];for(let sequenceStep=0;sequenceStep<ids.length;sequenceStep++){const id=ids[sequenceStep],m=metas.get(id),p=pointOf(m);if(!p)continue;const rm=routeMetrics(p);frames.push({id,sequenceId,sequenceStep,lat:p.lat,lng:p.lng,routeProgress:rm.progress,routeDistance:rm.distance,isPano:!!m?.is_pano,compass:Number.isFinite(+m?.computed_compass_angle)?+m.computed_compass_angle:(Number.isFinite(+m?.compass_angle)?+m.compass_angle:null)})}if(frames.length<2)return null;const first=frames[0],last=frames[frames.length-1],gain=last.routeProgress-first.routeProgress;if(gain<.08)return null;const usable=frames.filter(f=>f.routeDistance<=MAX_ROUTE_DISTANCE).length;if(usable<Math.max(2,Math.floor(frames.length*.7)))return null;const pano=frames.filter(f=>f.isPano).length;return{sequenceId,direction:'Next',frames,startDistance:Number.isFinite(startDistance)?startDistance:distanceMeters(START,first),goalDistance:Number.isFinite(goalDistance)?goalDistance:distanceMeters(GOAL,last),pano,denseFrameCount,progressGain:gain,source,score:frames.length*40+pano*3+gain*250}}
    async function evaluateHotSequence(){const ids=await orderedIds(HOT_SEQUENCE_ID);const a=ids.indexOf(HOT_START_IMAGE_ID),b=ids.indexOf(HOT_GOAL_IMAGE_ID);if(a<0||b<0||a===b)return null;const sign=b>a?1:-1,dense=[];for(let i=a;;i+=sign){dense.push(ids[i]);if(i===b)break}const chosen=sampleIds(dense,TARGET_FRAMES);const route=await framesFromIds(HOT_SEQUENCE_ID,chosen,'known-good-sequence',dense.length);if(!route)return null;route.direction=sign>0?'Next':'Prev';route.startDistance=distanceMeters(START,route.frames[0]);route.goalDistance=distanceMeters(GOAL,route.frames[route.frames.length-1]);return route}
    async function locateEndpoints(ids){if(ids.length<2)return null;const count=Math.min(PROBE_COUNT,ids.length),indexes=[];for(let i=0;i<count;i++)indexes.push(Math.round(i*(ids.length-1)/Math.max(1,count-1)));const coarse=await metadata(indexes.map(i=>ids[i]),'id,computed_geometry');let startIndex=-1,goalIndex=-1,startD=Infinity,goalD=Infinity;for(const i of indexes){const p=pointOf(coarse.get(ids[i]));if(!p)continue;const ds=distanceMeters(START,p),dg=distanceMeters(GOAL,p);if(ds<startD){startD=ds;startIndex=i}if(dg<goalD){goalD=dg;goalIndex=i}}if(startIndex<0||goalIndex<0)return null;const refine=new Set();for(const center of [startIndex,goalIndex])for(let i=Math.max(0,center-REFINE_RADIUS);i<=Math.min(ids.length-1,center+REFINE_RADIUS);i++)refine.add(i);const fine=await metadata([...refine].map(i=>ids[i]),'id,computed_geometry');startD=Infinity;goalD=Infinity;for(const i of refine){const p=pointOf(fine.get(ids[i]));if(!p)continue;const ds=distanceMeters(START,p),dg=distanceMeters(GOAL,p);if(ds<startD){startD=ds;startIndex=i}if(dg<goalD){goalD=dg;goalIndex=i}}return{startIndex,goalIndex,startD,goalD}}
    function denseSegment(ids,startIndex,goalIndex){if(startIndex<0||goalIndex<0||startIndex===goalIndex)return[];const sign=goalIndex>startIndex?1:-1,out=[];for(let i=startIndex;;i+=sign){out.push(ids[i]);if(i===goalIndex)break}return out}
    async function evaluateSequence(sequenceId,source='candidate'){const ids=await orderedIds(sequenceId);if(ids.length<2)return null;const loc=await locateEndpoints(ids);if(!loc||loc.startD>ENDPOINT_LIMIT||loc.goalD>ENDPOINT_LIMIT)return null;const dense=denseSegment(ids,loc.startIndex,loc.goalIndex);if(dense.length<2)return null;const chosenIds=sampleIds(dense,TARGET_FRAMES),route=await framesFromIds(sequenceId,chosenIds,source,dense.length,loc.startD,loc.goalD);if(!route)return null;route.direction=loc.goalIndex>loc.startIndex?'Next':'Prev';route.score-=loc.startD+loc.goalD;return route}
    async function tinySearch(point,radius=38){for(const limit of [20,10,5]){try{return await mly(`/images?bbox=${encodeURIComponent(pointBbox(point,radius))}&limit=${limit}&fields=${encodeURIComponent('id,sequence,computed_geometry,is_pano')}`)}catch(error){if(!error?.reduceAmount)throw error}}return{data:[]}}
    async function discoverSequenceHints(){const hints=new Map(),stops=[0,.25,.5,.75,1];for(let si=0;si<stops.length;si++){setStatus(`route上のsequence候補を確認中 ${si+1}/${stops.length}…`);const data=await tinySearch(interpolate(stops[si]));for(const row of data?.data||[]){const sid=sequenceOf(row?.sequence);if(!sid)continue;const p=pointOf(row);if(!p||routeMetrics(p).distance>MAX_ROUTE_DISTANCE)continue;let h=hints.get(sid);if(!h)hints.set(sid,h={id:sid,stops:new Set(),hits:0,pano:0});h.stops.add(si);h.hits++;if(row?.is_pano)h.pano++}}return[...hints.values()].sort((a,b)=>(b.stops.size-a.stops.size)||(b.pano-a.pano)||(b.hits-a.hits)).map(h=>h.id)}
    async function resolveRoute(){const cached=loadRouteCache();if(cached){state.routeCacheHit=true;setStatus('前回確認済みrouteを即時利用…');return cached}setStatus('前回成功したsequenceを高速確認中…');let best=await evaluateHotSequence().catch(()=>null);if(best){saveRouteCache(best);return best}setStatus('既存道路sequenceをGPSで確認中…');best=await evaluateSequence(SEED_SEQUENCE_ID,'road-seed').catch(()=>null);if(best&&best.frames.length>=Math.min(TARGET_FRAMES,20)){saveRouteCache(best);return best}const hints=await discoverSequenceHints().catch(()=>[]);for(const sid of hints.slice(0,8)){if(sid===SEED_SEQUENCE_ID||sid===HOT_SEQUENCE_ID)continue;const c=await evaluateSequence(sid,'route-search').catch(()=>null);if(c&&(!best||c.score>best.score))best=c}if(!best)throw new Error('ルート上のsequenceを確定できませんでした');saveRouteCache(best);return best}
    function currentFrame(){return state.frames[state.cursor]||null}
    function nextFrame(){return state.frames[state.cursor+1]||null}
    function updateTravelHeading(){const a=currentFrame(),b=nextFrame()||state.frames[state.cursor-1];state.currentTravelHeading=a&&b?bearing(a,b):null}
    function fmt(v,d=1,s=''){return Number.isFinite(v)?`${Number(v).toFixed(d)}${s}`:'—'}
    function average(values){return values.length?values.reduce((a,b)=>a+b,0)/values.length:null}
    function avgTransition(){return average(state.transitionTimes)}
    function avgCadence(){return average(state.cadenceTimes)}
    function requestedInterval(){return Number($('speed').value)||900}
    function renderDiag(){const f=currentFrame(),rows=[['version',VERSION],['frame / step',`${Math.min(state.cursor+1,state.frames.length)} / ${state.frames.length} (success ${state.successfulFrames})`],['sequenceId',state.sequenceId],['Next / Prev',state.direction],['requested cadence',fmt(requestedInterval(),0,'ms')],['actual cadence',fmt(state.lastCadenceMs,0,'ms')],['avg cadence',fmt(avgCadence(),0,'ms')],['routeProgress',Number.isFinite(state.currentProgress)?`${(state.currentProgress*100).toFixed(1)}%`:'—'],['routeDistance',fmt(state.currentRouteDistance,1,'m')],['travelHeading',fmt(state.currentTravelHeading,1,'°')],['userViewOffset',fmt(state.userViewOffset,1,'°')],['currentViewHeading',fmt(state.currentViewHeading,1,'°')],['imageTransitionMs',fmt(state.lastTransitionMs,0,'ms')],['avgTransitionMs',fmt(avgTransition(),0,'ms')],['cache fast / slow',`${state.fastMoves} / ${state.slowMoves}`],['deadline misses',String(state.deadlineMisses)],['cache depth','sequence 4'],['transition mode','Instantaneous'],['route cache',state.routeCacheHit?'HIT':'MISS'],['initialDisplayMs',fmt(state.initialDisplayMs,0,'ms')],['360 / Rectilinear',state.currentProjection],['360 in route',`${state.frames.filter(x=>x.isPano).length}/${state.frames.length}`],['anchor start / goal',`${fmt(state.startDistance,0,'m')} / ${fmt(state.goalDistance,0,'m')}`],['dense sequence frames',String(state.denseFrameCount||0)],['route source',state.preparedFrom],['reverse events',String(state.reverseEvents)],['regression streak',String(state.regressionStreak)],['view jumps',String(state.viewJumps)],['stopReason',state.stopReason],['frameId',f?.id||'—']];$('diagGrid').innerHTML=rows.map(([k,v])=>`<span>${k}</span><b>${String(v)}</b>`).join('')}
    function setFrameMetrics(){const f=currentFrame();if(!f)return;state.currentProgress=f.routeProgress;state.currentRouteDistance=f.routeDistance;state.maxProgressSeen=Number.isFinite(state.maxProgressSeen)?Math.max(state.maxProgressSeen,f.routeProgress):f.routeProgress;updateTravelHeading();if(Number.isFinite(state.currentViewHeading)&&Number.isFinite(state.currentTravelHeading)){state.userViewOffset=angleDiff(state.currentViewHeading,state.currentTravelHeading);state.heldOffset=state.userViewOffset}renderDiag()}
    async function readBearing(){if(!state.viewer)return null;try{const b=await state.viewer.getBearing();if(Number.isFinite(b)){state.currentViewHeading=norm360(b);return state.currentViewHeading}}catch{}return null}
    async function gentlyPreservePano(offset){if(!state.viewer||state.pointerActive||state.currentProjection!=='360'||!Number.isFinite(state.currentTravelHeading))return;const before=await readBearing();if(!Number.isFinite(before))return;const desired=norm360(state.currentTravelHeading+offset),delta=angleDiff(desired,before);if(Math.abs(delta)<3)return;if(Math.abs(delta)>45)state.viewJumps++;if(Math.abs(delta)>75)return;let center;try{center=await state.viewer.getCenter()}catch{return}if(!Array.isArray(center)||center.length<2)return;state.correcting=true;const startX=Number(center[0]),y=Math.min(.92,Math.max(.08,Number(center[1]))),steps=6;for(let i=1;i<=steps;i++){if(state.pointerActive)break;const eased=1-Math.pow(1-i/steps,2),x=((startX+(delta/360)*eased)%1+1)%1;state.viewer.setCenter([x,y]);await sleep(26)}state.correcting=false;const after=await readBearing();if(Number.isFinite(after)&&Math.abs(angleDiff(after,desired))>45)state.viewJumps++}
    function logFrame(){const f=currentFrame();state.logs.push({step:state.cursor+1,id:f?.id||null,sequenceId:state.sequenceId,direction:state.direction,requestedCadenceMs:requestedInterval(),actualCadenceMs:state.lastCadenceMs,routeProgress:state.currentProgress,routeDistance:state.currentRouteDistance,travelHeading:state.currentTravelHeading,userViewOffset:state.userViewOffset,currentViewHeading:state.currentViewHeading,imageTransitionMs:state.lastTransitionMs,projection:state.currentProjection,regressionStreak:state.regressionStreak,stopReason:state.stopReason})}
    function stop(reason='user-stop'){state.playing=false;state.moveToken++;state.stopReason=reason;$('start').disabled=false;$('stop').disabled=true;setStatus(reason==='completed-50'?`完了: ${state.successfulFrames}/${TARGET_FRAMES}枚 / avg ${Math.round(avgCadence()||0)}ms`:`停止: ${reason}`);renderDiag()}
    function reverseGuard(target){if(target.routeDistance>MAX_ROUTE_DISTANCE)return`off-route-${Math.round(target.routeDistance)}m`;const maxSeen=Number.isFinite(state.maxProgressSeen)?state.maxProgressSeen:currentFrame()?.routeProgress;const behind=Number.isFinite(maxSeen)?maxSeen-target.routeProgress:0;if(behind>REGRESSION_HARD){state.reverseEvents++;return'route-progress-hard-regression'}if(behind>REGRESSION_SOFT)state.regressionStreak++;else state.regressionStreak=Math.max(0,state.regressionStreak-1);if(state.regressionStreak>=REGRESSION_STREAK_LIMIT){state.reverseEvents++;return'route-progress-sustained-regression'}return null}
    async function moveOne(){if(!state.playing)return false;const target=nextFrame();if(!target){stop(state.frames.length>=TARGET_FRAMES?'completed-50':'sequence-end');return false}const guard=reverseGuard(target);if(guard){stop(guard);return false}const myToken=state.moveToken,held=Number.isFinite(state.userViewOffset)?state.userViewOffset:0;state.heldOffset=held;const t0=performance.now();try{const image=await state.viewer.moveTo(target.id);if(!state.playing||myToken!==state.moveToken)return false;const now=performance.now(),dt=now-t0;state.lastTransitionMs=dt;state.transitionTimes.push(dt);if(dt<=requestedInterval())state.fastMoves++;else state.slowMoves++;if(Number.isFinite(state.lastDisplayAt)){state.lastCadenceMs=now-state.lastDisplayAt;state.cadenceTimes.push(state.lastCadenceMs)}state.lastDisplayAt=now;state.cursor++;state.successfulFrames++;state.currentProjection=String(image?.cameraType||'').toLowerCase()==='spherical'||target.isPano?'360':'Rectilinear';setFrameMetrics();await readBearing();await gentlyPreservePano(state.pointerActive?state.heldOffset:held);setFrameMetrics();logFrame();return true}catch(error){if(!state.playing)return false;stop(`moveTo-error: ${error?.message||error}`);return false}}
    async function playback(){const run=++state.moveToken;state.playing=true;state.stopReason='playing';state.deadlineMisses=0;state.cadenceTimes=[];state.lastCadenceMs=null;state.lastDisplayAt=performance.now();$('start').disabled=true;$('stop').disabled=false;try{state.viewer.setTransitionMode(window.mapillary.TransitionMode.Instantaneous)}catch{}setStatus(`${state.direction} / ${requestedInterval()}ms cadence。sequence cache 4で先読み中`);let due=performance.now()+requestedInterval();while(state.playing&&run===state.moveToken){if(state.cursor>=Math.min(TARGET_FRAMES,state.frames.length)-1){stop(state.frames.length>=TARGET_FRAMES?'completed-50':'sequence-end');break}const now=performance.now(),wait=due-now;if(wait>0)await sleep(wait);else if(wait<-60)state.deadlineMisses++;const scheduled=due,ok=await moveOne();if(!ok||!state.playing)break;const interval=requestedInterval();due=scheduled+interval;if(due<performance.now()-interval)due=performance.now()}}
    function installPointerTracking(){const el=state.viewer?.getCanvasContainer?.()||$('mly');el.addEventListener('touchstart',()=>{state.pointerActive=true},{passive:true});el.addEventListener('touchend',()=>{state.pointerActive=false},{passive:true});el.addEventListener('touchcancel',()=>{state.pointerActive=false},{passive:true})}
    function installViewerEvents(){state.viewer.on('pov',async e=>{const b=await e.target.getBearing().catch(()=>null);if(!Number.isFinite(b))return;state.currentViewHeading=norm360(b);if(Number.isFinite(state.currentTravelHeading)&&(!state.correcting||state.pointerActive)){const off=angleDiff(state.currentViewHeading,state.currentTravelHeading);state.userViewOffset=off;if(state.pointerActive||!state.playing)state.heldOffset=off}renderDiag()});state.viewer.on('image',e=>{const image=e?.image;if(image){state.currentProjection=String(image.cameraType||'').toLowerCase()==='spherical'?'360':'Rectilinear';renderDiag()}})}
    async function initViewer(route){const M=window.mapillary;if(!M?.Viewer)throw new Error('MapillaryJS 4.1.2を読み込めませんでした');state.sequenceId=route.sequenceId;state.direction=route.direction;state.frames=route.frames.slice(0,TARGET_FRAMES);state.cursor=0;state.startDistance=route.startDistance;state.goalDistance=route.goalDistance;state.preparedFrom=route.source;state.denseFrameCount=route.denseFrameCount;state.stopReason=state.frames.length>=TARGET_FRAMES?'ready':'ready-short-sequence';state.viewer=new M.Viewer({accessToken:token(),container:'mly',imageTiling:true,transitionMode:M.TransitionMode.Instantaneous,component:{cover:false,cache:{depth:CACHE_DEPTH},direction:false,sequence:false}});try{await state.viewer.setFilter(['==','sequenceId',route.sequenceId])}catch{}try{state.viewer.getComponent('pointer').configure({dragPan:true,scrollZoom:false,touchZoom:true})}catch{}installPointerTracking();installViewerEvents();const t0=performance.now(),image=await state.viewer.moveTo(state.frames[0].id);state.initialDisplayMs=performance.now()-t0;state.successfulFrames=1;state.currentProjection=String(image?.cameraType||'').toLowerCase()==='spherical'||state.frames[0].isPano?'360':'Rectilinear';state.lastDisplayAt=performance.now();await readBearing();setFrameMetrics();logFrame();state.setupMs=performance.now()-state.setupStarted;$('start').disabled=false;setStatus(`${route.direction} / ${state.frames.length}枚。cache 4先読み・高速transition準備完了。`);renderDiag()}
    function diagnosticsText(){return JSON.stringify({test:'MapillaryJS',version:VERSION,route:`${START.name} -> ${GOAL.name}`,sequenceId:state.sequenceId,direction:state.direction,targetFrames:TARGET_FRAMES,requestedCadenceMs:requestedInterval(),successfulFrames:state.successfulFrames,initialDisplayMs:state.initialDisplayMs,averageImageTransitionMs:avgTransition(),averageCadenceMs:avgCadence(),deadlineMisses:state.deadlineMisses,cacheFastMoves:state.fastMoves,cacheSlowMoves:state.slowMoves,cacheDepth:CACHE_DEPTH,transitionMode:'Instantaneous',routeCacheHit:state.routeCacheHit,reverseEvents:state.reverseEvents,regressionStreak:state.regressionStreak,viewJumps:state.viewJumps,panoFrames:state.frames.filter(f=>f.isPano).length,totalPreparedFrames:state.frames.length,denseSequenceFrames:state.denseFrameCount,startAnchorDistanceM:state.startDistance,goalAnchorDistanceM:state.goalDistance,routeSource:state.preparedFrom,stopReason:state.stopReason,setupMs:state.setupMs,frames:state.logs},null,2)}
    async function copyDiagnostics(){const text=diagnosticsText();try{await navigator.clipboard.writeText(text);setStatus('Diagnosticsをコピーしました')}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();setStatus('Diagnosticsをコピーしました')}}
    async function boot(){if(!token()){$('tokenSheet').hidden=false;setStatus('Mapillary Access Tokenを設定してください');return}try{const route=await resolveRoute();await initViewer(route)}catch(error){state.stopReason=`setup-error: ${error?.message||error}`;setStatus(state.stopReason);renderDiag();$('diag').classList.add('is-open')}}
    $('start').addEventListener('click',()=>{if(!state.playing)playback()});
    $('stop').addEventListener('click',()=>stop('user-stop'));
    $('toggleDiag').addEventListener('click',()=>{$('diag').classList.toggle('is-open');renderDiag()});
    $('copyDiag').addEventListener('click',copyDiagnostics);
    $('speed').addEventListener('input',()=>{$('speedOut').value=`${(Number($('speed').value)/1000).toFixed(2)}s`;renderDiag()});
    $('saveToken').addEventListener('click',()=>{const v=$('tokenInput').value.trim();if(!v)return;try{localStorage.setItem(TOKEN_KEY,v)}catch{}location.reload()});
    $('cancelToken').addEventListener('click',()=>{location.href='/'});
    addEventListener('pagehide',()=>{try{state.viewer?.remove()}catch{}},{once:true});
    renderDiag();boot();
  })();
  </script>
</body>
