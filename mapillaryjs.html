<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#050b0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MapillaryJS Journey Test</title>
  <link rel="stylesheet" href="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.css" />
  <style>
    :root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans",sans-serif;background:#050b0a;color:#fff}*{box-sizing:border-box}html,body,#mly{width:100%;height:100%;margin:0;overflow:hidden}body{background:#050b0a}button,input{font:inherit}#mly{position:fixed;inset:0;background:#020504;touch-action:none}.preload-host{position:fixed;left:-10000px;top:0;width:320px;height:180px;opacity:.01;pointer-events:none;overflow:hidden}.top{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}.glass{border:1px solid rgba(255,255,255,.14);background:rgba(5,12,11,.78);box-shadow:0 12px 34px rgba(0,0,0,.3);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.title{padding:9px 11px;border-radius:14px;display:grid;gap:2px}.title b{font-size:12px}.title small{font-size:8px;color:rgba(255,255,255,.55)}.back{pointer-events:auto;min-height:38px;padding:0 12px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(5,12,11,.78);color:#fff;font-weight:800;font-size:10px;text-decoration:none;display:grid;place-items:center;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.controls{position:fixed;z-index:22;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding:10px;border-radius:17px;display:grid;gap:8px}.control-row{display:grid;grid-template-columns:1fr 1fr auto;gap:7px}.controls button{min-height:42px;border:1px solid rgba(255,255,255,.13);border-radius:12px;background:rgba(255,255,255,.07);color:#fff;font-size:10px;font-weight:800}.controls .primary{background:#fff;color:#07110f}.controls button:disabled{opacity:.4}.speed{display:flex;align-items:center;gap:8px;font-size:9px;color:rgba(255,255,255,.6)}.speed input{width:100%;accent-color:#fff}.speed output{width:52px;text-align:right;color:#fff;font-variant-numeric:tabular-nums}.status{font-size:9px;line-height:1.45;color:rgba(255,255,255,.68);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preload-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:8px;color:rgba(255,255,255,.5)}.bar{height:4px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;transition:width .2s}.diag{position:fixed;z-index:21;top:calc(env(safe-area-inset-top,0px) + 73px);right:10px;width:min(350px,calc(100vw - 20px));max-height:calc(100vh - 285px - env(safe-area-inset-bottom,0px));overflow:auto;padding:10px;border-radius:15px;display:none}.diag.is-open{display:block}.diag-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.diag-head b{font-size:10px}.diag-head button{border:1px solid rgba(255,255,255,.12);border-radius:9px;background:rgba(255,255,255,.06);color:#fff;padding:6px 9px;font-size:8px}.grid{display:grid;grid-template-columns:1fr auto;gap:5px 9px;font-size:8px;line-height:1.35}.grid span{color:rgba(255,255,255,.5)}.grid b{font-variant-numeric:tabular-nums;text-align:right;max-width:210px;overflow-wrap:anywhere}.note{margin:8px 0 0;font-size:7px;line-height:1.45;color:rgba(255,255,255,.42)}.sheet{position:fixed;z-index:40;inset:0;display:grid;place-items:end center;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 12px);background:rgba(0,0,0,.42)}.sheet[hidden]{display:none}.sheet-card{width:min(520px,100%);padding:16px;border-radius:22px;background:#0b1513;border:1px solid rgba(255,255,255,.14)}.sheet-card h1{font-size:18px;margin:0 0 6px}.sheet-card p{font-size:10px;line-height:1.55;color:rgba(255,255,255,.58);margin:0 0 12px}.sheet-card input{width:100%;min-height:44px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.06);color:#fff;padding:0 12px}.sheet-actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}.sheet-actions button{min-height:42px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:rgba(255,255,255,.07);color:#fff;font-weight:800}.sheet-actions .save{background:#fff;color:#07110f}@media(orientation:landscape){.controls{left:10px;right:auto;width:min(430px,44vw)}.diag{top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;max-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 20px)}}
  </style>
</head>
<body>
  <div id="mly" aria-label="MapillaryJS公式Viewer"></div><div id="mlyPreload" class="preload-host" aria-hidden="true"></div>
  <header class="top"><div class="title glass"><b>MapillaryJS</b><small>烏丸御池 → 四条烏丸 / 公式Viewer</small></div><a class="back" href="/">テスト一覧</a></header>
  <section id="diag" class="diag glass"><div class="diag-head"><b>Diagnostics</b><button id="copyDiag" type="button">コピー</button></div><div id="diagGrid" class="grid"></div><p class="note">表示側は61c4版と同じDefault transition。開始前の先読みもMapillaryJS公式Viewer / image tiling / moveToだけを使用する。</p></section>
  <section class="controls glass"><div class="control-row"><button id="start" class="primary" type="button" disabled>再生開始</button><button id="stop" type="button" disabled>停止</button><button id="toggleDiag" type="button">診断</button></div><label class="speed"><span>速度</span><input id="speed" type="range" min="450" max="1800" step="50" value="800" /><output id="speedOut">0.80s</output></label><div class="preload-row"><div class="bar"><i id="preloadBar"></i></div><span id="preloadText">先読み準備中</span></div><div id="status" class="status">MapillaryJSを準備中…</div></section>
  <section id="tokenSheet" class="sheet" hidden><div class="sheet-card"><h1>Mapillary Access Token</h1><p>既存テストと同じlocalStorageキーを使う。トークンはGitHubへ保存しない。</p><input id="tokenInput" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="MLY|..." /><div class="sheet-actions"><button id="saveToken" class="save" type="button">保存して開始</button><button id="cancelToken" type="button">戻る</button></div></div></section>
  <script src="https://unpkg.com/mapillary-js@4.1.2/dist/mapillary.js"></script><script src="/mapillaryjs-test.js"></script>
</body></html>
