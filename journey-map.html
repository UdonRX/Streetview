<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#05070a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Streetview" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css?v=0.1.6" />
  <title>Streetview Journey — Map route</title>
</head>
<body>
  <main id="app" class="app" aria-live="polite">
    <section id="viewer" class="viewer" aria-label="自動ストリートビュー">
      <img id="layerA" class="scene-layer is-visible" alt="" decoding="async" draggable="false" />
      <img id="layerB" class="scene-layer" alt="" decoding="async" draggable="false" />
      <div class="vignette"></div><div class="motion-blur"></div>
      <header class="top-hud"><span class="brand">STREETVIEW JOURNEY</span><span id="sourceBadge" class="badge">Coverage</span></header>
      <section class="bottom-hud"><div class="location-row"><span id="placeLabel">Selected route</span><span id="frameLabel">0 / 0</span></div><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><div class="meta-row"><span id="headingLabel">—°</span><span id="networkLabel">0.08秒・jsfeat Worker</span><span id="coordLabel">—</span></div></section>
    </section>
    <section id="startPanel" class="start-panel"><div class="start-card">
      <p class="eyebrow">MAP JOURNEY</p><h1>選んだ撮影済みルートを再生する。</h1><p class="lead" id="selectedRouteLead">URLと実画像の先行バッファを作ってからJourney Engineへ渡す。</p>
      <div class="preset-card"><span class="preset-title">地図から選択</span><strong id="selectedRouteName">ルートを読み込み中</strong><small id="selectedRouteMeta">—</small></div>
      <details class="custom-route"><summary>緯度・経度</summary><div class="coord-inputs"><label>緯度<input id="latInput" inputmode="decimal" value="0" /></label><label>経度<input id="lngInput" inputmode="decimal" value="0" /></label></div><label class="toggle-row"><input id="useCoordinates" type="checkbox" /><span>座標検索</span></label></details>
      <button id="startButton" class="start-button" type="button">このルートで旅をはじめる</button><p class="fineprint">URLは約48枚先まで確保し、実画像を先読みしてから0.08秒再生を始める。</p>
    </div></section>
    <section id="errorPanel" class="error-panel" hidden><div class="error-card"><strong>旅を開始できなかった</strong><p id="errorMessage"></p><button id="retryButton" type="button">地図へ戻る</button></div></section>
  </main>
  <script>
  (()=>{
    const KEY='streetview:journey-route',TOKEN_KEY='streetview:mapillary-token',GRAPH='https://graph.mapillary.com';
    const INITIAL_URL_BUFFER=48,FETCH_BATCH=16,MAX_RETRY=2,FETCH_TRIGGER_AHEAD=32,SAVE_INTERVAL=3000,STREAM_POLL_MS=120,PROBE_TIMEOUT_MS=9000;
    const traceStarted=performance.now(),trace=window.__journeyStartupTrace={schema:'streetview-journey-startup-diagnostic-v1',version:'0.1.40-buffer-window',startedAt:new Date().toISOString(),events:[]};
    const event=(name,data={})=>{const row={tMs:Math.round(performance.now()-traceStarted),name,...data};trace.events.push(row);if(trace.events.length>160)trace.events.shift();console.info('[JourneyStartup]',row);return row};
    const safeUrl=u=>{try{const x=new URL(String(u||''),location.href);return{present:!!u,protocol:x.protocol,host:x.host,path:x.pathname.slice(-110),queryKeys:[...x.searchParams.keys()].slice(0,12),length:String(u||'').length}}catch{return{present:!!u,invalid:true,length:String(u||'').length}}};
    const frameSummary=(f,i)=>({index:i,id:String(f?.id||'').slice(0,48),sequenceId:String(f?.sequenceId||'').slice(0,48),sequenceIndex:f?.sequenceIndex??null,provider:f?.provider||null,hasCoords:Number.isFinite(f?.lat)&&Number.isFinite(f?.lng),heading:Number.isFinite(f?.heading)?f.heading:null,url:safeUrl(f?.url),sourceUrl:safeUrl(f?.sourceUrl)});
    const proxyUrl=u=>u?`/api/imagery?mode=mapillary-image&url=${encodeURIComponent(u)}`:'';
    let selected=null,lastSave=0,streamStarted=false,directStarted=false,engineWaitLogged=false;
    try{selected=JSON.parse(sessionStorage.getItem(KEY)||'null');event('session-route-read',{ok:!!selected})}catch(e){event('session-route-parse-error',{message:String(e?.message||e)})}
    if(selected?.provider==='Mapillary'&&Array.isArray(selected.frames)&&selected.frames.length>INITIAL_URL_BUFFER){
      const overflow=selected.frames.splice(INITIAL_URL_BUFFER).map(f=>({id:String(f?.id||''),sequenceId:String(f?.sequenceId||''),sequenceIndex:f?.sequenceIndex??0})).filter(r=>r.id);
      selected.streamPending=[...overflow,...(Array.isArray(selected.streamPending)?selected.streamPending:[])];
      event('initial-url-window-trim',{kept:selected.frames.length,returnedToPending:overflow.length,target:INITIAL_URL_BUFFER});
      try{sessionStorage.setItem(KEY,JSON.stringify(selected))}catch{}
    }
    const nativeFetch=window.fetch.bind(window);
    const token=()=>{try{return localStorage.getItem(TOKEN_KEY)||''}catch{return''}};
    window.__journeySelectedRoute=selected;
    window.__journeyValidationRoute=selected?{id:'map-selected',name:selected.provider||selected.source||'Selected',kind:'地図選択',mode:'fixed',sequenceId:selected.sequenceId||null,lat:selected.frames?.[0]?.lat??null,lng:selected.frames?.[0]?.lng??null}:null;
    window.__journeyStreamState={frames:selected?.frames||[],active:false,complete:!selected?.streamPending?.length,total:selected?.selection?.totalImageIds||selected?.frames?.length||0,failed:false};
    event('selected-route-summary',{provider:selected?.provider||selected?.source||null,frames:Array.isArray(selected?.frames)?selected.frames.length:-1,pending:Array.isArray(selected?.streamPending)?selected.streamPending.length:-1,total:selected?.selection?.totalImageIds||null,sequences:Array.isArray(selected?.sequenceIds)?selected.sequenceIds.length:null,firstFrames:(selected?.frames||[]).slice(0,3).map(frameSummary),invalidUrlCount:Array.isArray(selected?.frames)?selected.frames.filter(f=>!f?.url).length:null});

    function resourceTiming(url){try{const rows=performance.getEntriesByName(url);const r=rows[rows.length-1];return r?{duration:Math.round(r.duration),transferSize:r.transferSize||0,encodedBodySize:r.encodedBodySize||0,decodedBodySize:r.decodedBodySize||0,initiatorType:r.initiatorType||null}:null}catch{return null}}
    function probeImage(f,i,label='probe'){
      if(!f?.url){event(`${label}-invalid-url`,{index:i});return}
      const started=performance.now(),im=new Image();let done=false;
      const finish=(status,extra={})=>{if(done)return;done=true;clearTimeout(timer);event(`${label}-${status}`,{index:i,elapsedMs:Math.round(performance.now()-started),url:safeUrl(f.url),timing:resourceTiming(f.url),...extra})};
      const timer=setTimeout(()=>finish('timeout'),PROBE_TIMEOUT_MS);
      im.decoding='async';im.onload=()=>finish('load',{naturalWidth:im.naturalWidth,naturalHeight:im.naturalHeight});im.onerror=()=>finish('error');im.src=f.url;
      event(`${label}-start`,{index:i,url:safeUrl(f.url)});
    }
    async function batchMeta(refs,label='stream'){
      const t=token();if(!t)throw new Error('Mapillary token missing');
      const out=new Array(refs.length).fill(null),fields='id,sequence,captured_at,computed_geometry,compass_angle,thumb_2048_url,is_pano';
      const ids=refs.map(r=>r.id).join(','),url=`${GRAPH}/images?image_ids=${encodeURIComponent(ids)}&fields=${encodeURIComponent(fields)}`;
      const started=performance.now();event(`${label}-meta-request`,{count:refs.length});
      try{const r=await nativeFetch(url,{headers:{Authorization:`OAuth ${t}`},cache:'no-store'}),j=await r.json().catch(()=>({}));event(`${label}-meta-response`,{status:r.status,ok:r.ok,elapsedMs:Math.round(performance.now()-started),dataCount:Array.isArray(j?.data)?j.data.length:0,apiError:j?.error?.message||null});if(!r.ok||j?.error)return out;const by=new Map((j?.data||[]).map(x=>[String(x.id),x]));refs.forEach((ref,i)=>{out[i]=by.get(String(ref.id))||null})}catch(e){event(`${label}-meta-exception`,{elapsedMs:Math.round(performance.now()-started),message:String(e?.message||e)})}
      return out;
    }
    function frame(m,r){const c=m?.computed_geometry?.coordinates,source=m?.thumb_2048_url;if(!Array.isArray(c)||c.length<2||!source)return null;return{id:String(m.id),sequenceId:String(r.sequenceId),sequenceIndex:r.sequenceIndex,lat:+c[1],lng:+c[0],heading:Number.isFinite(+m.compass_angle)?+m.compass_angle:null,projection:m.is_pano?'SPHERE':'RECTILINEAR',fieldOfView:m.is_pano?360:100,sourceUrl:source,url:proxyUrl(source),provider:'Mapillary',capturedAt:m.captured_at||null}}
    function syncState(){const s=window.__journeyStreamState;if(!s||!selected)return;s.frames=selected.frames;s.active=streamStarted&&!!selected.streamPending?.length;s.complete=!selected.streamPending?.length;s.total=selected.selection?.totalImageIds||selected.frames.length;window.__journeySelectedRoute=selected}
    function save(force=false){const now=Date.now();if(!force&&now-lastSave<SAVE_INTERVAL)return;lastSave=now;try{sessionStorage.setItem(KEY,JSON.stringify(selected))}catch{}}
    function playbackIndex(){const p=window.__journeyPlaybackState;return Number.isFinite(p?.index)?p.index:0}
    function updateMeta(){if(!selected)return;const done=selected.frames?.length||0,pending=selected.streamPending?.length||0,total=selected.selection?.totalImageIds||done+pending;const meta=document.getElementById('selectedRouteMeta');if(meta)meta.textContent=pending?`${done}件URL準備済み / 全${total}件予定`:`${done}枚の連続画像`;syncState()}

    async function refreshInitialUrls(){
      if(!selected||selected.provider!=='Mapillary'||!Array.isArray(selected.frames)||!selected.frames.length)return;
      const old=selected.frames.map(f=>f?.sourceUrl||f?.url||''),refs=selected.frames.map(f=>({id:String(f.id),sequenceId:String(f.sequenceId||''),sequenceIndex:f.sequenceIndex??0}));
      let refreshed=0,changed=0,missing=0;
      event('initial-url-refresh-start',{count:refs.length});
      for(let s=0;s<refs.length;s+=FETCH_BATCH){
        const part=refs.slice(s,s+FETCH_BATCH),metas=await batchMeta(part,'initial-refresh');
        for(let i=0;i<part.length;i++){
          const idx=s+i,m=metas[i],fresh=m?frame(m,part[i]):null;
          if(!fresh){missing++;continue}
          if(fresh.sourceUrl!==old[idx])changed++;
          Object.assign(selected.frames[idx],fresh);refreshed++;
        }
      }
      syncState();save(true);
      event('initial-url-refresh-done',{refreshed,changed,missing,transport:'same-origin-proxy',firstFrames:selected.frames.slice(0,3).map(frameSummary)});
    }

    async function waitUntilMoreNeeded(){while(selected?.streamPending?.length){const ahead=(selected.frames?.length||0)-playbackIndex()-1;if(ahead<=FETCH_TRIGGER_AHEAD)return;await new Promise(r=>setTimeout(r,STREAM_POLL_MS))}}
    async function continueStream(){
      if(streamStarted)return;streamStarted=true;syncState();event('stream-start',{pending:selected?.streamPending?.length||0,available:selected?.frames?.length||0});
      if(!selected||selected.provider!=='Mapillary'||!Array.isArray(selected.streamPending)||!selected.streamPending.length){syncState();event('stream-not-needed');return}
      selected.streamOpen=true;syncState();
      try{
        while(selected.streamPending.length){
          await waitUntilMoreNeeded();
          const refs=selected.streamPending.splice(0,FETCH_BATCH),meta=await batchMeta(refs,'stream'),frames=[],retry=[];
          for(let i=0;i<refs.length;i++){const f=meta[i]?frame(meta[i],refs[i]):null;if(f)frames.push(f);else{const rr={...refs[i],retry:(refs[i].retry||0)+1};if(rr.retry<=MAX_RETRY)retry.push(rr)}}
          if(frames.length)selected.frames.push(...frames);
          if(retry.length)selected.streamPending.push(...retry);
          event('stream-batch-added',{added:frames.length,retry:retry.length,available:selected.frames.length,pending:selected.streamPending.length,transport:'same-origin-proxy'});
          updateMeta();save(false);await new Promise(r=>setTimeout(r,STREAM_POLL_MS));
        }
      }catch(e){window.__journeyStreamState.failed=true;event('stream-failed',{message:String(e?.message||e)})}
      finally{selected.streamOpen=false;syncState();updateMeta();save(true);event('stream-finished',{available:selected?.frames?.length||0,pending:selected?.streamPending?.length||0,failed:!!window.__journeyStreamState.failed})}
    }

    function startupSnapshot(){const s=window.__journeyStreamState||{},p=window.__journeyPlaybackState||{},engine=window.JourneyEngine;return{schema:trace.schema,version:trace.version,exportedAt:new Date().toISOString(),page:{href:location.pathname+location.search,visibility:document.visibilityState,online:navigator.onLine,userAgent:navigator.userAgent,serviceWorker:{supported:'serviceWorker'in navigator,controlled:!!navigator.serviceWorker?.controller,scriptURL:navigator.serviceWorker?.controller?.scriptURL||null}},selected:{provider:selected?.provider||selected?.source||null,frames:selected?.frames?.length||0,pending:selected?.streamPending?.length||0,total:selected?.selection?.totalImageIds||0,sequences:selected?.sequenceIds?.length||0,invalidUrlCount:Array.isArray(selected?.frames)?selected.frames.filter(f=>!f?.url).length:null,firstFrames:(selected?.frames||[]).slice(0,3).map(frameSummary)},engine:{available:!!engine,startFrames:typeof engine?.startFrames==='function',state:typeof engine?.getState==='function'?engine.getState():null},stream:{active:!!s.active,complete:!!s.complete,total:s.total||0,frameCount:Array.isArray(s.frames)?s.frames.length:0,failed:!!s.failed},playback:p,dom:{frameLabel:document.getElementById('frameLabel')?.textContent||null,networkLabel:document.getElementById('networkLabel')?.textContent||null,errorVisible:!document.getElementById('errorPanel')?.hidden,errorMessage:document.getElementById('errorMessage')?.textContent||null,layerASrc:safeUrl(document.getElementById('layerA')?.currentSrc||document.getElementById('layerA')?.src||'')},events:trace.events.slice(-160)}}
    window.__copyJourneyStartupLog=async()=>{const text=JSON.stringify(startupSnapshot(),null,2);try{await navigator.clipboard.writeText(text);return true}catch{try{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();return true}catch{return false}}};
    function installCompactLogButton(){let btn=document.getElementById('jdCopy');if(!btn){btn=document.createElement('button');btn.id='jdCopy';btn.type='button';document.body.appendChild(btn)}btn.textContent='起動ログコピー';btn.style.cssText='position:fixed;z-index:30;right:10px;top:calc(env(safe-area-inset-top) + 62px);width:auto;height:30px;padding:0 9px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(5,8,12,.58);color:#fff;font:700 9px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:auto';btn.addEventListener('click',async e=>{e.preventDefault();e.stopImmediatePropagation();const ok=await window.__copyJourneyStartupLog();btn.textContent=ok?'コピー完了':'コピー失敗';setTimeout(()=>btn.textContent='起動ログコピー',1200)},{once:false})}

    async function startDirect(){
      if(directStarted||!selected||!Array.isArray(selected.frames)||selected.frames.length<2){event('direct-start-skipped',{directStarted,hasSelected:!!selected,frames:selected?.frames?.length||0});return}
      if(!window.JourneyEngine?.startFrames){if(!engineWaitLogged){engineWaitLogged=true;event('engine-wait',{appScript:'/app.js?v=0.1.40'})}setTimeout(startDirect,25);return}
      directStarted=true;event('engine-ready-for-direct',{engineState:window.JourneyEngine.getState?.()||null});
      const panel=document.getElementById('startPanel');if(panel)panel.hidden=true;
      const net=document.getElementById('networkLabel');if(net)net.textContent=`Mapillary URL ${selected.frames.length}枚を更新中…`;
      try{await refreshInitialUrls()}catch(e){event('initial-url-refresh-failed',{message:String(e?.message||e)})}
      if(net)net.textContent=`URL ${selected.frames.length}枚準備済み・実画像先読みへ`;
      selected.frames.slice(0,3).forEach((f,i)=>probeImage(f,i,'proxy-probe'));
      window.addEventListener('journey-playback-started',e=>{event('playback-started-event',{detail:e.detail||null,engineState:window.JourneyEngine?.getState?.()||null});continueStream().catch(err=>{window.__journeyStreamState.failed=true;syncState();event('continue-stream-rejected',{message:String(err?.message||err)})})},{once:true});
      const started=performance.now();event('startFrames-call',{frames:selected.frames.length,streamTotal:window.__journeyStreamState.total,transport:'same-origin-proxy',first:frameSummary(selected.frames[0],0)});
      Promise.resolve(window.JourneyEngine.startFrames(selected.frames,window.__journeyStreamState)).then(()=>event('startFrames-resolved',{elapsedMs:Math.round(performance.now()-started),engineState:window.JourneyEngine?.getState?.()||null})).catch(e=>{directStarted=false;event('startFrames-rejected',{elapsedMs:Math.round(performance.now()-started),name:e?.name||null,message:String(e?.message||e),engineState:window.JourneyEngine?.getState?.()||null})});
    }

    window.addEventListener('journey-engine-ready',e=>event('journey-engine-ready-event',{detail:e.detail||null}));
    window.addEventListener('error',e=>event('window-error',{message:e.message||null,filename:e.filename?.split('/').pop()||null,line:e.lineno||null,column:e.colno||null}));
    window.addEventListener('unhandledrejection',e=>event('unhandled-rejection',{message:String(e.reason?.message||e.reason||'unknown')}));
    window.addEventListener('DOMContentLoaded',()=>{
      event('dom-content-loaded',{swControlled:!!navigator.serviceWorker?.controller});
      const provider=selected?.provider||selected?.source||'Coverage',count=Array.isArray(selected?.frames)?selected.frames.length:0,total=selected?.selection?.totalImageIds||count+(selected?.streamPending?.length||0),seq=selected?.sequenceId||'—';
      const badge=document.getElementById('sourceBadge');if(badge)badge.textContent=provider;
      const name=document.getElementById('selectedRouteName');if(name)name.textContent=`${provider} / ${selected?.sequenceIds?.length>1?selected.sequenceIds.length+' sequences':'Sequence '+seq}`;
      const meta=document.getElementById('selectedRouteMeta');if(meta)meta.textContent=selected?.streamPending?.length?`${count}件URL準備済み / 全${total}件予定`:`${count}枚の連続画像`;
      const lead=document.getElementById('selectedRouteLead');if(lead)lead.textContent=selected?.streamPending?.length?'URLを約48枚先まで維持し、実画像を先読みしてから再生する。':selected?`${provider}の実画像sequenceを直接再生する。`:'地図で候補を選び直してください。';
      if(provider==='Mapillary'){const hud=document.querySelector('.top-hud');if(hud&&!document.getElementById('mapillaryAttribution')){const a=document.createElement('a');a.id='mapillaryAttribution';a.href='https://www.mapillary.com/';a.target='_blank';a.rel='noopener';a.textContent='© Mapillary';a.style.cssText='margin-left:8px;color:#fff;font-size:9px;text-decoration:none;opacity:.82';hud.appendChild(a)}}
      if(!selected||count<2){const b=document.getElementById('startButton');if(b){b.disabled=true;b.textContent='地図からルートを選択してね'}}else if(new URLSearchParams(location.search).get('autostart')==='1')startDirect();
      const back=document.getElementById('journeyBack');if(back)back.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();location.href='/'},true);
      const retry=document.getElementById('retryButton');if(retry)retry.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();location.href='/'},true);
      installCompactLogButton();
    });
  })();
  </script>
  <script src="/travel-axis.js?v=0.1.30"></script><script src="/diagnostics.js?v=0.1.30" defer></script><script src="/app.js?v=0.1.40" defer></script>
</body>
</html>
