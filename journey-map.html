<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#05070a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Streetview" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css?v=0.1.6" />
  <title>Streetview Journey — Map route</title>
</head>
<body>
  <main id="app" class="app" aria-live="polite">
    <section id="viewer" class="viewer" aria-label="自動ストリートビュー">
      <img id="layerA" class="scene-layer is-visible" alt="" decoding="async" draggable="false" />
      <img id="layerB" class="scene-layer" alt="" decoding="async" draggable="false" />
      <div class="vignette"></div><div class="motion-blur"></div>
      <header class="top-hud"><span class="brand">STREETVIEW JOURNEY</span><span id="sourceBadge" class="badge">Coverage</span></header>
      <section class="bottom-hud"><div class="location-row"><span id="placeLabel">Selected route</span><span id="frameLabel">0 / 0</span></div><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><div class="meta-row"><span id="headingLabel">—°</span><span id="networkLabel">0.08秒・jsfeat Worker</span><span id="coordLabel">—</span></div></section>
    </section>
    <section id="startPanel" class="start-panel"><div class="start-card">
      <p class="eyebrow">PHASE 2 MAP JOURNEY</p><h1>選んだ撮影済みルートを再生する。</h1><p class="lead" id="selectedRouteLead">地図で選択したsequenceをJourney Engineへ接続する。</p>
      <div class="preset-card"><span class="preset-title">地図から選択</span><strong id="selectedRouteName">ルートを読み込み中</strong><small id="selectedRouteMeta">—</small></div>
      <details class="custom-route"><summary>緯度・経度</summary><div class="coord-inputs"><label>緯度<input id="latInput" inputmode="decimal" value="0" /></label><label>経度<input id="lngInput" inputmode="decimal" value="0" /></label></div><label class="toggle-row"><input id="useCoordinates" type="checkbox" /><span>座標検索</span></label></details>
      <button id="startButton" class="start-button" type="button">このルートで旅をはじめる</button><p class="fineprint">Phase 1の傾き補正・Motion Worker・Visual Headingをそのまま使用する。</p>
    </div></section>
    <section id="errorPanel" class="error-panel" hidden><div class="error-card"><strong>旅を開始できなかった</strong><p id="errorMessage"></p><button id="retryButton" type="button">もう一度</button></div></section>
  </main>
  <script>
  (()=>{
    const KEY='streetview:journey-route';
    let selected=null;try{selected=JSON.parse(sessionStorage.getItem(KEY)||'null');}catch{}
    const nativeFetch=window.fetch.bind(window);
    window.fetch=(input,init)=>{const url=typeof input==='string'?input:input?.url||'';if(selected&&url.includes('/api/imagery'))return Promise.resolve(new Response(JSON.stringify(selected),{status:200,headers:{'Content-Type':'application/json'}}));return nativeFetch(input,init);};
    window.__journeyValidationRoute=selected?{id:'map-selected',name:selected.provider||selected.source||'Selected',kind:'地図選択',mode:'fixed',sequenceId:selected.sequenceId||null,lat:selected.frames?.[0]?.lat??null,lng:selected.frames?.[0]?.lng??null}:null;
    window.addEventListener('DOMContentLoaded',()=>{
      const provider=selected?.provider||selected?.source||'Coverage';
      const count=Array.isArray(selected?.frames)?selected.frames.length:0;
      const seq=selected?.sequenceId||'—';
      const badge=document.getElementById('sourceBadge');if(badge)badge.textContent=provider;
      const name=document.getElementById('selectedRouteName');if(name)name.textContent=`${provider} / Sequence ${seq}`;
      const meta=document.getElementById('selectedRouteMeta');if(meta)meta.textContent=`${count}枚の連続画像`;
      const lead=document.getElementById('selectedRouteLead');if(lead)lead.textContent=selected?`${provider}の実画像sequenceを直接再生する。`:'地図で候補を選び直してください。';
      if(provider==='Mapillary'){
        const hud=document.querySelector('.top-hud');if(hud&&!document.getElementById('mapillaryAttribution')){const a=document.createElement('a');a.id='mapillaryAttribution';a.href='https://www.mapillary.com/';a.target='_blank';a.rel='noopener';a.textContent='© Mapillary';a.style.cssText='margin-left:8px;color:#fff;font-size:9px;text-decoration:none;opacity:.82';hud.appendChild(a);}
      }
      if(!selected||count<2){const b=document.getElementById('startButton');if(b){b.disabled=true;b.textContent='地図からルートを選択してね';}}
      else if(new URLSearchParams(location.search).get('autostart')==='1')setTimeout(()=>document.getElementById('startButton')?.click(),180);
    });
  })();
  </script>
  <script src="/travel-axis.js?v=0.1.30"></script><script src="/diagnostics.js?v=0.1.30" defer></script><script src="/app.js?v=0.1.30" defer></script>
</body>
</html>
