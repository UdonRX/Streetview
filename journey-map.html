<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#05070a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Streetview" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/styles.css?v=0.1.6" />
  <title>Streetview Journey — Map route</title>
</head>
<body>
  <main id="app" class="app" aria-live="polite">
    <section id="viewer" class="viewer" aria-label="自動ストリートビュー">
      <img id="layerA" class="scene-layer is-visible" alt="" decoding="async" draggable="false" />
      <img id="layerB" class="scene-layer" alt="" decoding="async" draggable="false" />
      <div class="vignette"></div><div class="motion-blur"></div>
      <header class="top-hud"><span class="brand">STREETVIEW JOURNEY</span><span id="sourceBadge" class="badge">Coverage</span></header>
      <section class="bottom-hud"><div class="location-row"><span id="placeLabel">Selected route</span><span id="frameLabel">0 / 0</span></div><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><div class="meta-row"><span id="headingLabel">—°</span><span id="networkLabel">0.08秒・jsfeat Worker</span><span id="coordLabel">—</span></div></section>
    </section>
    <section id="startPanel" class="start-panel"><div class="start-card">
      <p class="eyebrow">PHASE 2 MAP JOURNEY</p><h1>選んだ撮影済みルートを再生する。</h1><p class="lead" id="selectedRouteLead">地図で選択したsequenceをJourney Engineへ接続する。</p>
      <div class="preset-card"><span class="preset-title">地図から選択</span><strong id="selectedRouteName">ルートを読み込み中</strong><small id="selectedRouteMeta">—</small></div>
      <details class="custom-route"><summary>緯度・経度</summary><div class="coord-inputs"><label>緯度<input id="latInput" inputmode="decimal" value="0" /></label><label>経度<input id="lngInput" inputmode="decimal" value="0" /></label></div><label class="toggle-row"><input id="useCoordinates" type="checkbox" /><span>座標検索</span></label></details>
      <button id="startButton" class="start-button" type="button">このルートで旅をはじめる</button><p class="fineprint">先頭バッファから開始し、残りは再生中にバックグラウンド取得する。</p>
    </div></section>
    <section id="errorPanel" class="error-panel" hidden><div class="error-card"><strong>旅を開始できなかった</strong><p id="errorMessage"></p><button id="retryButton" type="button">もう一度</button></div></section>
  </main>
  <script>
  (()=>{
    const KEY='streetview:journey-route',TOKEN_KEY='streetview:mapillary-token',GRAPH='https://graph.mapillary.com',CHUNK=96,BATCH=48,MAX_RETRY=2,LOW_BUFFER=24,HIGH_BUFFER=72,SAVE_INTERVAL=3000,RENDER_CHECK=18,RENDER_TIMEOUT=3200;
    let selected=null,lastSave=0,autoStarting=false;try{selected=JSON.parse(sessionStorage.getItem(KEY)||'null');}catch{}
    window.__journeySelectedRoute=selected;
    const nativeFetch=window.fetch.bind(window);
    window.fetch=(input,init)=>{const url=typeof input==='string'?input:input?.url||'';if(selected&&url.includes('/api/imagery'))return Promise.resolve({ok:true,status:200,json:async()=>selected});return nativeFetch(input,init);};
    window.__journeyValidationRoute=selected?{id:'map-selected',name:selected.provider||selected.source||'Selected',kind:'地図選択',mode:'fixed',sequenceId:selected.sequenceId||null,lat:selected.frames?.[0]?.lat??null,lng:selected.frames?.[0]?.lng??null}:null;
    window.__journeyStreamState={frames:selected?.frames||[],active:!!selected?.streamPending?.length,complete:!selected?.streamPending?.length,total:selected?.selection?.totalImageIds||selected?.frames?.length||0,failed:false};
    const token=()=>{try{return localStorage.getItem(TOKEN_KEY)||''}catch{return''}};
    async function batchMeta(refs){const t=token();if(!t)throw new Error('Mapillary token missing');const out=new Array(refs.length).fill(null),fields='id,sequence,captured_at,computed_geometry,compass_angle,thumb_2048_url,is_pano';for(let s=0;s<refs.length;s+=BATCH){const part=refs.slice(s,s+BATCH),ids=part.map(r=>r.id).join(','),url=`${GRAPH}/images?image_ids=${encodeURIComponent(ids)}&fields=${encodeURIComponent(fields)}`;try{const r=await nativeFetch(url,{headers:{Authorization:`OAuth ${t}`}}),j=await r.json().catch(()=>({}));if(!r.ok||j?.error)continue;const by=new Map((j?.data||[]).map(x=>[String(x.id),x]));part.forEach((ref,i)=>{out[s+i]=by.get(String(ref.id))||null})}catch{}}return out}
    function frame(m,r){const c=m?.computed_geometry?.coordinates;if(!Array.isArray(c)||c.length<2||!m?.thumb_2048_url)return null;return{id:String(m.id),sequenceId:String(r.sequenceId),sequenceIndex:r.sequenceIndex,lat:+c[1],lng:+c[0],heading:Number.isFinite(+m.compass_angle)?+m.compass_angle:null,projection:m.is_pano?'SPHERE':'RECTILINEAR',fieldOfView:m.is_pano?360:100,url:m.thumb_2048_url,provider:'Mapillary',capturedAt:m.captured_at||null}}
    function syncState(){const s=window.__journeyStreamState;if(!s||!selected)return;s.frames=selected.frames;s.active=!!selected.streamPending?.length;s.complete=!s.active;s.total=selected.selection?.totalImageIds||selected.frames.length;window.__journeySelectedRoute=selected}
    function save(force=false){const now=Date.now();if(!force&&now-lastSave<SAVE_INTERVAL)return;lastSave=now;try{sessionStorage.setItem(KEY,JSON.stringify(selected))}catch{}}
    function engineHasStarted(){return !!window.__journeyPlaybackState||String(document.getElementById('placeLabel')?.textContent||'').startsWith('Sequence #')}
    function updateStreamingHud(){if(!selected)return;const done=selected.frames?.length||0,pending=selected.streamPending?.length||0,total=selected.selection?.totalImageIds||done+pending;const meta=document.getElementById('selectedRouteMeta');if(meta)meta.textContent=pending?`${done}枚準備済み / 全${total}枚予定`:`${done}枚の連続画像`;syncState();if(engineHasStarted())return;const net=document.getElementById('networkLabel');if(net)net.textContent=pending?`開始画像を確認中 ${done}/${total}`:`準備完了 ${done}/${total}`}
    function prewarm(frames){for(const f of frames.slice(0,48)){try{const i=new Image();i.decoding='async';i.referrerPolicy='no-referrer';i.src=f.url}catch{}}}
    function canRender(f){return new Promise(resolve=>{if(!f?.url)return resolve(false);const im=new Image(),timer=setTimeout(()=>{im.onload=im.onerror=null;resolve(false)},RENDER_TIMEOUT);im.decoding='async';im.referrerPolicy='no-referrer';im.onload=()=>{clearTimeout(timer);resolve(true)};im.onerror=()=>{clearTimeout(timer);resolve(false)};im.src=f.url})}
    async function ensureRenderableHead(){for(let attempt=0;attempt<18;attempt++){syncState();const list=Array.isArray(selected?.frames)?selected.frames:[];if(list.length>=2){const probe=list.slice(0,Math.min(RENDER_CHECK,list.length)),ok=await Promise.all(probe.map(canRender));let run=0,start=-1;for(let i=0;i<ok.length;i++){if(ok[i]){if(!run)start=i;run++;if(run>=2){if(start>0)selected.frames.splice(0,start);syncState();save(true);const first=selected.frames[0];const layer=document.getElementById('layerA');if(layer&&first?.url){layer.src=first.url;layer.style.opacity='1'}prewarm(selected.frames);return true}}else{run=0;start=-1}}}await new Promise(r=>setTimeout(r,180))}return false}
    function setSpeed(ms){const r=document.querySelector(`input[name="driveSpeed"][value="${ms}"]`);if(r&&!r.checked){r.checked=true;r.dispatchEvent(new Event('change',{bubbles:true}))}}
    function bufferGuard(){if(!selected?.streamPending?.length)return;const txt=document.getElementById('frameLabel')?.textContent||'',m=txt.match(/(\d+)\s*\/\s*(\d+)/);if(!m)return;const current=Math.max(0,+m[1]-1),available=window.__journeyStreamState?.frames?.length||selected.frames?.length||0,buffer=available-current;if(buffer<=LOW_BUFFER)setSpeed(120);else if(buffer>=HIGH_BUFFER)setSpeed(80)}
    async function continueStream(){if(!selected||selected.provider!=='Mapillary'||!Array.isArray(selected.streamPending)||!selected.streamPending.length){syncState();return}selected.streamOpen=true;syncState();let rounds=0;while(selected.streamPending.length){const refs=selected.streamPending.splice(0,CHUNK),meta=await batchMeta(refs),frames=[],retry=[];for(let i=0;i<refs.length;i++){const f=meta[i]?frame(meta[i],refs[i]):null;if(f)frames.push(f);else{const r={...refs[i],retry:(refs[i].retry||0)+1};if(r.retry<=MAX_RETRY)retry.push(r)}}if(frames.length){selected.frames.push(...frames);prewarm(frames)}if(retry.length)selected.streamPending.push(...retry);rounds++;updateStreamingHud();bufferGuard();if(rounds%4===0)save(false);await new Promise(r=>setTimeout(r,16))}selected.streamOpen=false;syncState();setSpeed(80);updateStreamingHud();save(true)}
    async function autoStart(){if(autoStarting||!selected||!Array.isArray(selected.frames))return;autoStarting=true;const panel=document.getElementById('startPanel');if(panel)panel.hidden=true;const net=document.getElementById('networkLabel');if(net)net.textContent='先頭画像を確認中…';const ready=await ensureRenderableHead();if(!ready){const err=document.getElementById('errorPanel'),msg=document.getElementById('errorMessage');if(msg)msg.textContent='再生できる先頭画像を準備できませんでした。地図から別の撮影ルートを選んでください。';if(err)err.hidden=false;autoStarting=false;return}const btn=document.getElementById('startButton');if(net)net.textContent='Journey Engineを開始中…';btn?.click()}
    function installCompactLogButton(){const box=document.getElementById('journeyDiag'),btn=document.getElementById('jdCopy');if(box)box.style.setProperty('display','none','important');if(!btn)return;btn.textContent='ログコピー';btn.style.cssText='position:fixed;z-index:30;right:10px;top:calc(env(safe-area-inset-top) + 62px);width:auto;height:30px;padding:0 9px;border:1px solid rgba(255,255,255,.22);border-radius:999px;background:rgba(5,8,12,.58);color:#fff;font:700 9px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:auto';document.body.appendChild(btn)}
    window.addEventListener('DOMContentLoaded',()=>{
      const provider=selected?.provider||selected?.source||'Coverage',count=Array.isArray(selected?.frames)?selected.frames.length:0,total=selected?.selection?.totalImageIds||count+(selected?.streamPending?.length||0),seq=selected?.sequenceId||'—';
      const badge=document.getElementById('sourceBadge');if(badge)badge.textContent=provider;
      const name=document.getElementById('selectedRouteName');if(name)name.textContent=`${provider} / ${selected?.sequenceIds?.length>1?selected.sequenceIds.length+' sequences':'Sequence '+seq}`;
      const meta=document.getElementById('selectedRouteMeta');if(meta)meta.textContent=selected?.streamPending?.length?`${count}枚準備済み / 全${total}枚予定`:`${count}枚の連続画像`;
      const lead=document.getElementById('selectedRouteLead');if(lead)lead.textContent=selected?.streamPending?.length?'先頭バッファですぐ開始。残りは再生中に取得する。':selected?`${provider}の実画像sequenceを直接再生する。`:'地図で候補を選び直してください。';
      if(provider==='Mapillary'){const hud=document.querySelector('.top-hud');if(hud&&!document.getElementById('mapillaryAttribution')){const a=document.createElement('a');a.id='mapillaryAttribution';a.href='https://www.mapillary.com/';a.target='_blank';a.rel='noopener';a.textContent='© Mapillary';a.style.cssText='margin-left:8px;color:#fff;font-size:9px;text-decoration:none;opacity:.82';hud.appendChild(a)}}
      if(!selected||count<2){const b=document.getElementById('startButton');if(b){b.disabled=true;b.textContent='地図からルートを選択してね'}}else if(new URLSearchParams(location.search).get('autostart')==='1')autoStart().catch(()=>{});
      const back=document.getElementById('journeyBack');if(back)back.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();location.href='/'},true);
      setInterval(bufferGuard,220);setTimeout(installCompactLogButton,0);
      continueStream().catch(()=>{if(selected){selected.streamOpen=false;window.__journeyStreamState.failed=true;window.__journeyStreamState.active=false;syncState();save(true)}});
    });
  })();
  </script>
  <script src="/travel-axis.js?v=0.1.30"></script><script src="/diagnostics.js?v=0.1.30" defer></script><script src="/app.js?v=0.1.31" defer></script>
</body>
</html>
